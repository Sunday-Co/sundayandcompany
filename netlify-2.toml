# Sunday & Company - Netlify configuration
# Publishes the corrected site folder, then applies one global typography/modal pass.
# This keeps all 16 pages consistent without manually editing every HTML file.

[build]
command = '''
rm -rf _site
mkdir -p _site
cp -R assets _site/assets
cp support.js web3forms.js robots.txt sitemap.xml social-preview.png _site/
cp -R Sunday-Co-Ysabeau-Mobile-Forms-Update/. _site/

node <<'NODE'
const fs = require('fs');
const path = require('path');

const fontLink = `<link data-sunday-general-sans href="https://api.fontshare.com/v2/css?f[]=general-sans@200,300,400,500&display=swap" rel="stylesheet" />`;

const designPatch = `<style data-sunday-typography-modal-fix>
/* ==========================================================
   SUNDAY & COMPANY
   FINAL READABILITY + MODAL SIZE PASS
   General Sans Light is the secondary typeface.
   ========================================================== */

[style*="font-family:'General Sans'"],
[style*='font-family:"General Sans"'] {
  font-weight: 300 !important;
}

[style*="font-family:'General Sans'"] strong,
[style*='font-family:"General Sans"'] strong {
  font-weight: 400 !important;
}

button[style*="font-family:'General Sans'"],
a[style*="font-family:'General Sans'"],
input,
textarea,
select {
  font-weight: 400 !important;
}

@media (min-width: 701px) {
  [style*="font-family:'General Sans'"][style*="font-size:6.5px"] { font-size: 11.5px !important; }
  [style*="font-family:'General Sans'"][style*="font-size:7px"]   { font-size: 12px !important; }
  [style*="font-family:'General Sans'"][style*="font-size:8px"]   { font-size: 12.5px !important; }
  [style*="font-family:'General Sans'"][style*="font-size:9px"]   { font-size: 13px !important; }
  [style*="font-family:'General Sans'"][style*="font-size:10px"]  { font-size: 13.5px !important; }
  [style*="font-family:'General Sans'"][style*="font-size:11px"]  { font-size: 14px !important; }
  [style*="font-family:'General Sans'"][style*="font-size:12px"]  { font-size: 14.5px !important; }

  [aria-label="The Sunday Reservation"] {
    width: min(720px, calc(100vw - 64px)) !important;
    max-width: 720px !important;
    min-height: 0 !important;
    height: auto !important;
    max-height: calc(100vh - 64px) !important;
    overflow: hidden !important;
  }

  [aria-label="The Sunday Reservation"] > div[aria-hidden] {
    min-height: 510px !important;
    height: 510px !important;
    max-height: 510px !important;
  }

  [aria-label="The Sunday Reservation"] > div:last-child {
    min-height: 510px !important;
    height: auto !important;
    padding: 27px 29px 23px !important;
    overflow-y: auto !important;
  }

  [aria-label="The Sunday Reservation"] h2 {
    font-size: 24px !important;
    line-height: 1.02 !important;
  }

  [aria-label="The Sunday Reservation"] p {
    font-size: 13px !important;
    line-height: 1.48 !important;
  }

  [aria-label="The Sunday Reservation"] label {
    font-size: 11.5px !important;
  }

  [aria-label="The Sunday Reservation"] [data-res-fineprint] {
    font-size: 10.5px !important;
    line-height: 1.45 !important;
  }

  [aria-label="Project inquiry"] > div {
    width: min(900px, calc(100vw - 80px)) !important;
    max-width: 900px !important;
    min-height: 0 !important;
    height: auto !important;
    max-height: calc(100vh - 64px) !important;
    padding: 27px 34px 23px !important;
    overflow-y: auto !important;
  }

  [aria-label="Project inquiry"] h2 {
    font-size: 31px !important;
    line-height: 1 !important;
  }

  [aria-label="Project inquiry"] form[data-inq] {
    gap: 10px 14px !important;
  }

  [aria-label="Project inquiry"] form[data-inq] label > span,
  [aria-label="Project inquiry"] form[data-inq] legend {
    font-size: 12.5px !important;
    font-weight: 300 !important;
  }

  [aria-label="Project inquiry"] form[data-inq] input,
  [aria-label="Project inquiry"] form[data-inq] select {
    min-height: 41px !important;
    font-size: 14px !important;
  }

  [aria-label="Project inquiry"] form[data-inq] textarea {
    min-height: 78px !important;
    font-size: 14px !important;
  }
}

@media (max-width: 700px) {
  [style*="font-family:'General Sans'"][style*="font-size:6.5px"] { font-size: 12px !important; }
  [style*="font-family:'General Sans'"][style*="font-size:7px"]   { font-size: 12.5px !important; }
  [style*="font-family:'General Sans'"][style*="font-size:8px"]   { font-size: 13px !important; }
  [style*="font-family:'General Sans'"][style*="font-size:9px"]   { font-size: 13.5px !important; }
  [style*="font-family:'General Sans'"][style*="font-size:10px"]  { font-size: 14px !important; }
  [style*="font-family:'General Sans'"][style*="font-size:11px"]  { font-size: 14.5px !important; }
  [style*="font-family:'General Sans'"][style*="font-size:12px"]  { font-size: 15px !important; }

  [aria-label="Sunday and Company services"] span {
    font-size: 12px !important;
    line-height: 1.35 !important;
  }

  input,
  textarea,
  select {
    font-size: 16px !important;
  }

  [aria-label="The Sunday Reservation"] {
    width: calc(100vw - 28px) !important;
    max-width: calc(100vw - 28px) !important;
    min-height: 0 !important;
    height: auto !important;
    max-height: calc(100dvh - 28px) !important;
    grid-template-columns: 1fr !important;
    overflow-x: hidden !important;
    overflow-y: auto !important;
  }

  [aria-label="The Sunday Reservation"] > div[aria-hidden] {
    min-height: 170px !important;
    height: 180px !important;
    max-height: 190px !important;
  }

  [aria-label="The Sunday Reservation"] > div:last-child {
    min-height: 0 !important;
    height: auto !important;
    padding: 23px 20px 21px !important;
  }

  [aria-label="The Sunday Reservation"] h2 {
    font-size: 23px !important;
    line-height: 1.03 !important;
  }

  [aria-label="The Sunday Reservation"] p {
    font-size: 14px !important;
    line-height: 1.48 !important;
  }

  [aria-label="The Sunday Reservation"] label {
    font-size: 12.5px !important;
  }

  [aria-label="The Sunday Reservation"] [data-res-fineprint] {
    font-size: 11px !important;
    line-height: 1.45 !important;
  }

  [aria-label="The Sunday Reservation"] > div:last-child > div > div[aria-hidden] {
    margin: 11px 0 10px !important;
    padding: 8px 0 !important;
  }

  [aria-label="Project inquiry"] > div {
    width: calc(100vw - 24px) !important;
    max-width: calc(100vw - 24px) !important;
    min-height: 0 !important;
    height: auto !important;
    max-height: calc(100dvh - 24px) !important;
    padding: 20px 18px 18px !important;
    overflow-y: auto !important;
  }

  [aria-label="Project inquiry"] h2 {
    font-size: 25px !important;
    line-height: 1.02 !important;
  }

  [aria-label="Project inquiry"] form[data-inq] {
    grid-template-columns: 1fr !important;
    gap: 8px !important;
  }

  [aria-label="Project inquiry"] form[data-inq] fieldset {
    grid-template-columns: 1fr !important;
  }

  [aria-label="Project inquiry"] form[data-inq] label > span,
  [aria-label="Project inquiry"] form[data-inq] legend {
    font-size: 13px !important;
    line-height: 1.35 !important;
    font-weight: 300 !important;
  }

  [aria-label="Project inquiry"] form[data-inq] input,
  [aria-label="Project inquiry"] form[data-inq] select {
    min-height: 44px !important;
  }

  [aria-label="Project inquiry"] form[data-inq] textarea {
    min-height: 76px !important;
  }

  [aria-label="Project inquiry"] form[data-inq] > p,
  [aria-label="Project inquiry"] form[data-inq] > button {
    margin-top: 2px !important;
  }

  #inquiry form[data-inq] label > span,
  #inquiry form[data-inq] legend {
    font-size: 13px !important;
    line-height: 1.35 !important;
    font-weight: 300 !important;
  }

  #inquiry header h2 + p {
    font-size: 14px !important;
    line-height: 1.5 !important;
  }
}
</style>`;

function walk(dir) {
  const out = [];
  for (const entry of fs.readdirSync(dir, { withFileTypes: true })) {
    const full = path.join(dir, entry.name);
    if (entry.isDirectory()) out.push(...walk(full));
    else if (entry.isFile() && entry.name.endsWith('.html')) out.push(full);
  }
  return out;
}

const htmlFiles = walk('_site');

for (const file of htmlFiles) {
  let html = fs.readFileSync(file, 'utf8');

  html = html.replace(/family=Ysabeau:wght@300;400;500&/g, '');
  html = html.replace(/Ysabeau/g, 'General Sans');

  if (!html.includes('data-sunday-general-sans')) {
    if (html.includes('</helmet>')) {
      html = html.replace('</helmet>', `${fontLink}\n${designPatch}\n</helmet>`);
    } else {
      html = html.replace('</head>', `${fontLink}\n${designPatch}\n</head>`);
    }
  }

  fs.writeFileSync(file, html);
}

console.log(`Sunday & Company: patched ${htmlFiles.length} HTML files with General Sans Light + readability/modal fixes.`);
NODE
'''
publish = "_site"

[[headers]]
for = "/*"

[headers.values]
X-Frame-Options = "DENY"
X-Content-Type-Options = "nosniff"
Referrer-Policy = "strict-origin-when-cross-origin"
Permissions-Policy = "camera=(), microphone=(), geolocation=(), payment=(), usb=(), magnetometer=(), accelerometer=()"
Strict-Transport-Security = "max-age=63072000; includeSubDomains; preload"
X-XSS-Protection = "1; mode=block"

[[headers]]
for = "/assets/*"

[headers.values]
Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
for = "/*.html"

[headers.values]
Cache-Control = "public, max-age=0, must-revalidate"

[[redirects]]
from = "http://sundayandcompany.co/*"
to = "https://sundayandcompany.co/:splat"
status = 301
force = true

[[redirects]]
from = "http://www.sundayandcompany.co/*"
to = "https://sundayandcompany.co/:splat"
status = 301
force = true

[[redirects]]
from = "https://www.sundayandcompany.co/*"
to = "https://sundayandcompany.co/:splat"
status = 301
force = true
