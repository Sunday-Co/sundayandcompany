name: Final Site QA V2

on:
  push:
    branches:
      - footer-reader-accessibility-fix-no-deploy-2026-09-13
    paths:
      - '.github/scripts/final_site_qa_v2.mjs'
      - '.github/workflows/final-site-qa-v2.yml'
      - '404.html'
      - '**/index.html'
      - '**/Site Header.dc.html'
      - '**/Site Footer.dc.html'
      - 'assets/site.css'
      - 'assets/site.js'
      - 'assets/rendered-corrections.css'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  webkit-qa:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install QA dependencies
        run: |
          npm init -y >/dev/null 2>&1
          npm install playwright@1.55.0 @axe-core/playwright@4.10.2 >/dev/null 2>&1
          npx playwright install --with-deps webkit
      - name: Serve candidate
        run: |
          python -m http.server 4173 >/tmp/sunday-http.log 2>&1 &
          echo $! > /tmp/sunday-http.pid
          sleep 2
      - name: Run corrected final QA
        run: node .github/scripts/final_site_qa_v2.mjs
      - name: Upload screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sunday-final-site-qa-v2
          path: final-site-qa-v2/
          if-no-files-found: ignore
