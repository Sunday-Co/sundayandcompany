name: Controlled UI Implementation

on:
  push:
    branches:
      - controlled-ui-audit-no-deploy-2026-09-13
    paths:
      - '.github/workflows/controlled-ui-implementation.yml'
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  implement:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply controlled source corrections
        run: python3 .github/scripts/apply_controlled_ui.py

      - name: Commit candidate source
        run: |
          git config user.name "Sunday-Co"
          git config user.email "hello@sundayandcompany.co"
          git add -A
          git commit -m "[skip netlify] Apply controlled typography and capture system"
          git push origin HEAD

      - name: Verify portfolio pages only changed asset cache key
        run: |
          python3 - <<'PY'
          import subprocess
          locked = [
            'our-work/index.html',
            'our-work/luckys-cafe-bakery/index.html',
            'our-work/petti-pathways/index.html',
            'our-work/pizzeria-coco/index.html',
            'our-work/folake/index.html',
          ]
          for p in locked:
            old = subprocess.check_output(['git','show','HEAD^:'+p], text=True)
            new = open(p).read()
            normalized = new.replace('v=20260913-12','v=20260912-11')
            if normalized != old:
              raise SystemExit(f'LOCKED PORTFOLIO PAGE CHANGED BEYOND CACHE KEY: {p}')
          print('Portfolio page presentation/behavior is untouched.')
          PY

      - name: Print production-source diff
        run: |
          git diff --stat HEAD^..HEAD
          git diff --name-only HEAD^..HEAD
