name: Finalize Sunday Clean Production

on:
  push:
    branches:
      - sunday-clean-production
    paths:
      - scripts/finalize_cleanup.py
      - .github/workflows/finalize-cleanup.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-latest
    steps:
      - name: Check out cleanup branch
        uses: actions/checkout@v4
        with:
          ref: sunday-clean-production
          fetch-depth: 0

      - name: Finalize and validate source
        run: python3 scripts/finalize_cleanup.py

      - name: Validate production files
        run: |
          git diff --check
          node --check assets/site.js
          python3 - <<'PY'
          import tomllib
          from pathlib import Path
          with open('netlify.toml','rb') as f:
              cfg = tomllib.load(f)
          assert cfg['build']['publish'] == '.'
          assert 'command' not in cfg['build']
          assert Path('assets/site.css').exists()
          assert Path('assets/site.js').exists()
          print('Production config, JS syntax and shared assets validated.')
          PY

      - name: Commit final source cleanup
        run: |
          git config user.name "Sunday & Company Cleanup"
          git config user.email "hello@sundayandcompany.co"
          git add -A
          if git diff --cached --quiet; then
            echo "No final source changes required."
          else
            git commit -m "Finalize clean production source"
            git push origin HEAD:sunday-clean-production
          fi
