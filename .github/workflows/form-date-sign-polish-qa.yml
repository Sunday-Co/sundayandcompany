name: Form Date Sign Polish QA

on:
  push:
    branches:
      - form-date-sign-polish-2026-09-14

permissions:
  contents: write

jobs:
  fix-and-verify:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: form-date-sign-polish-2026-09-14
          fetch-depth: 0

      - name: Apply candidate changes
        run: |
          python .github/scripts/apply_form_date_sign_polish.py
          python .github/scripts/patch_open_sign_visibility.py

      - name: Validate diff
        run: git diff --check

      - name: Install WebKit
        run: |
          mkdir -p /tmp/sunday-polish
          npm install --prefix /tmp/sunday-polish playwright@1.55.0 >/dev/null 2>&1
          /tmp/sunday-polish/node_modules/.bin/playwright install --with-deps webkit

      - name: Serve candidate
        run: |
          python -m http.server 4173 >/tmp/sunday-polish-http.log 2>&1 &
          sleep 2

      - name: Stabilize replay timing assertion
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('.github/scripts/form_date_sign_qa.cjs')
          s = p.read_text()
          old = """    const startsBefore=await page.evaluate(()=>window.__signStarts||0);
              await sign.evaluate(el=>el.dispatchEvent(new PointerEvent('pointerdown',{bubbles:true,cancelable:true,pointerType:'touch'})));
              await page.waitForTimeout(1200);
              const startsAfter=await page.evaluate(()=>window.__signStarts||0);
              check(`${cfg.name} sign re-swings on pointer/touch`,startsAfter>startsBefore,JSON.stringify({startsBefore,startsAfter}));

              const cta=sign.getByRole('button',{name:/Write Your Name In/}).first();
              await page.waitForTimeout(250);
              const beforeControl=await page.evaluate(()=>window.__signStarts||0);
              await cta.evaluate(el=>el.dispatchEvent(new PointerEvent('pointerdown',{bubbles:true,cancelable:true,pointerType:'touch'})));
              await page.waitForTimeout(900);
              const afterControl=await page.evaluate(()=>window.__signStarts||0);
              check(`${cfg.name} sign controls do not replay swing`,afterControl===beforeControl,JSON.stringify({beforeControl,afterControl}));
          """
          new = """    const startsBefore=await page.evaluate(()=>window.__signStarts||0);
              await sign.evaluate(el=>el.dispatchEvent(new PointerEvent('pointerdown',{bubbles:true,cancelable:true,pointerType:'touch'})));
              let replayObserved=true;
              try {
                await page.waitForFunction(before => (window.__signStarts||0) > before, startsBefore, {timeout:4000});
              } catch (_) {
                replayObserved=false;
              }
              const startsAfter=await page.evaluate(()=>window.__signStarts||0);
              check(`${cfg.name} sign re-swings on pointer/touch`,replayObserved&&startsAfter>startsBefore,JSON.stringify({startsBefore,startsAfter}));

              const cta=sign.getByRole('button',{name:/Write Your Name In/}).first();
              await page.waitForTimeout(900);
              const beforeControl=await swing.evaluate(el=>{const a=el.getAnimations().find(x=>x.animationName==='sc-rock')||el.getAnimations()[0];return a&&a.currentTime!=null?Number(a.currentTime):0;});
              await cta.evaluate(el=>el.dispatchEvent(new PointerEvent('pointerdown',{bubbles:true,cancelable:true,pointerType:'touch'})));
              await page.waitForTimeout(300);
              const afterControl=await swing.evaluate(el=>{const a=el.getAnimations().find(x=>x.animationName==='sc-rock')||el.getAnimations()[0];return a&&a.currentTime!=null?Number(a.currentTime):0;});
              check(`${cfg.name} sign controls do not replay swing`,beforeControl>250&&afterControl>=beforeControl,JSON.stringify({beforeControl,afterControl}));
          """
          if old not in s:
              raise SystemExit('QA replay timing marker missing')
          p.write_text(s.replace(old, new, 1))
          PY

      - name: Rendered WebKit verification
        run: |
          mkdir -p qa-artifacts
          node .github/scripts/form_date_sign_qa.cjs

      - name: Upload QA screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: form-date-sign-polish-qa
          path: qa-artifacts
          if-no-files-found: warn

      - name: Commit verified website source
        run: |
          git config user.name "Sunday-Co"
          git config user.email "hello@sundayandcompany.co"
          git add . ':!.github' ':!qa-artifacts'
          if git diff --cached --quiet; then
            echo "No website changes to commit"
            exit 0
          fi
          git commit -m "[skip netlify] Fix date picker, privacy line, and Open sign motion"
          git push origin HEAD:form-date-sign-polish-2026-09-14
