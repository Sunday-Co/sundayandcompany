name: Sunday WebKit QA

on:
  push:
    branches:
      - full-correction-audit-2026-09-11
    paths:
      - '**/*.html'
      - 'assets/**'
      - 'qa/**'
      - 'netlify.toml'
      - '.github/workflows/webkit-qa.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  webkit-qa:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out audit branch
        uses: actions/checkout@v4
        with:
          ref: full-correction-audit-2026-09-11

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install Playwright WebKit
        run: |
          npm install --no-save playwright@1.55.0
          npx playwright install --with-deps webkit

      - name: Start local site
        run: |
          python3 -m http.server 4173 --bind 127.0.0.1 > /tmp/sunday-http.log 2>&1 &
          echo $! > /tmp/sunday-http.pid
          for i in {1..20}; do
            if curl -fsS http://127.0.0.1:4173/ >/dev/null; then exit 0; fi
            sleep 1
          done
          cat /tmp/sunday-http.log
          exit 1

      - name: Run WebKit desktop and mobile QA
        run: node qa/webkit-qa.mjs

      - name: Upload QA screenshots and report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sunday-webkit-qa-${{ github.run_number }}
          path: qa-artifacts
          if-no-files-found: warn
          retention-days: 7
