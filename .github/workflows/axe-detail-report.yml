name: Axe Detail Report

on:
  push:
    branches:
      - footer-reader-accessibility-fix-no-deploy-2026-09-13
    paths:
      - '.github/scripts/axe_detail_report.mjs'
      - '.github/workflows/axe-detail-report.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  report:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install WebKit and axe
        run: |
          npm init -y >/dev/null 2>&1
          npm install playwright@1.55.0 @axe-core/playwright@4.10.2 >/dev/null 2>&1
          npx playwright install --with-deps webkit
      - name: Serve candidate
        run: |
          python -m http.server 4173 >/tmp/sunday-http.log 2>&1 &
          sleep 2
      - name: Run detailed axe report
        run: node .github/scripts/axe_detail_report.mjs
