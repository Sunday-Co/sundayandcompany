name: Verified Production Claim Fixes

on:
  push:
    branches:
      - production-claim-fixes-2026-09-14
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fix-and-qa:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout fix branch
        uses: actions/checkout@v4
        with:
          ref: production-claim-fixes-2026-09-14
          fetch-depth: 0

      - name: Apply narrow production fixes and sync shared components
        run: |
          python - <<'PY'
          from pathlib import Path
          import shutil

          def replace_once(path, old, new):
              p = Path(path)
              s = p.read_text()
              if old not in s:
                  raise SystemExit(f"Expected text not found in {path}: {old[:120]!r}")
              s2 = s.replace(old, new, 1)
              p.write_text(s2)

          # 1) Inquiry success receipt: make the actual shared header source match the approved treatment.
          replace_once(
              'Site Header.dc.html',
              '<h2 style="font-size:clamp(28px,3vw,38px);font-weight:400;letter-spacing:-.045em;line-height:.94;margin:0">Your Inquiry Is In.</h2>',
              '<h2 style="font-family:\'Inter Tight\',sans-serif;font-size:clamp(18px,2.2vw,24px);font-weight:500;letter-spacing:.12em;line-height:1.15;margin:0;text-transform:uppercase">YOUR INQUIRY IS IN.</h2>'
          )
          replace_once(
              'Site Header.dc.html',
              '<p style="font-size:12px;line-height:1.5;margin:12px auto 0;max-width:520px">Thank you for sharing the details. We have received your inquiry and will review it before following up.</p>',
              '<p style="font-family:\'Inter Tight\',sans-serif;font-size:11px;font-weight:300;letter-spacing:.02em;line-height:1.55;margin:12px auto 0;max-width:520px">Thank you for sharing the details. We have received your inquiry and will review it before following up.</p>'
          )

          # 2) Put the newsletter microtype into the canonical source, not only a CSS override.
          replace_once(
              'Site Footer.dc.html',
              '<p data-news-fineprint style="font-family:\'Inter Tight\',sans-serif;font-size:8px;letter-spacing:.055em;line-height:1.45;margin-top:7px;opacity:.78;text-transform:uppercase">',
              '<p data-news-fineprint style="font-family:\'Inter Tight\',sans-serif;font-size:8.25px;font-weight:300;letter-spacing:.035em;line-height:1.45;margin-top:7px;opacity:.78;text-transform:uppercase">'
          )

          # 3) Archive microtype: align the mobile archive header to the previously approved 7.5px value.
          replace_once('assets/rendered-corrections.css', 'font-size:7.25px;\n    letter-spacing:.125em;', 'font-size:7.5px;\n    letter-spacing:.125em;')

          # 4) OPEN sign: keep motion on viewport entry, but remove the decorative click behavior/cursor.
          replace_once(
              'index.html',
              '<div data-sign="true" style="cursor:pointer;margin:0 auto;max-width:{{ rbMax }};position:relative">',
              '<div data-sign="true" style="margin:0 auto;max-width:{{ rbMax }};position:relative">'
          )
          replace_once(
              'index.html',
              "      this._signClick = () => this.nudgeSign(true);\n      sign.addEventListener('click', this._signClick);\n      this._signEl = sign;",
              "      this._signEl = sign;"
          )

          # Remove the redundant global click-to-replay fallback as well.
          p = Path('assets/site.js')
          s = p.read_text()
          block = '''    if (!signMotionClickBound) {\n      document.addEventListener('click', function (event) {\n        var target = event.target;\n        if (target && target.closest && target.closest('[data-sign]')) {\n          triggerOriginalOpenSignMotion();\n        }\n      });\n      signMotionClickBound = true;\n    }\n\n'''
          if block not in s:
              raise SystemExit('Expected OPEN sign click fallback block not found in assets/site.js')
          s = s.replace(block, '', 1)
          s = s.replace("link.href = '/assets/rendered-corrections.css?v=20260913-14';", "link.href = '/assets/rendered-corrections.css?v=20260914-17';", 1)
          p.write_text(s)

          # 5) Make all public routes use one reviewed cache-busting asset version.
          routes = [
              'index.html','about/index.html','accessibility/index.html','contact/index.html','cookie-policy/index.html',
              'join-our-team/index.html','our-work/index.html','our-work/folake/index.html',
              'our-work/luckys-cafe-bakery/index.html','our-work/petti-pathways/index.html','our-work/pizzeria-coco/index.html',
              'privacy-policy/index.html','services/index.html','sunday-school/index.html','terms-and-conditions/index.html'
          ]
          for route in routes:
              p = Path(route)
              s = p.read_text()
              s = s.replace('20260913-16', '20260914-17')
              s = s.replace('20260913-14', '20260914-17')
              p.write_text(s)

          # 6) Eliminate the 42-copy drift. Canonical root files own these shared components.
          dirs = [
              'about','accessibility','contact','cookie-policy','join-our-team','our-work','our-work/folake',
              'our-work/luckys-cafe-bakery','our-work/petti-pathways','our-work/pizzeria-coco','privacy-policy',
              'services','sunday-school','terms-and-conditions'
          ]
          for name in ['Inquiry Form.dc.html','Site Footer.dc.html','Site Header.dc.html']:
              source = Path(name).read_bytes()
              for d in dirs:
                  target = Path(d) / name
                  target.write_bytes(source)

          print('Applied narrow fixes and synchronized shared components.')
          PY

      - name: Static verification before browser QA
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          failures=[]
          def check(name, ok, detail=''):
              print(('PASS' if ok else 'FAIL') + ' | ' + name + ((' | '+detail) if detail else ''))
              if not ok: failures.append(name + (': '+detail if detail else ''))

          routes = [
              'index.html','about/index.html','accessibility/index.html','contact/index.html','cookie-policy/index.html',
              'join-our-team/index.html','our-work/index.html','our-work/folake/index.html',
              'our-work/luckys-cafe-bakery/index.html','our-work/petti-pathways/index.html','our-work/pizzeria-coco/index.html',
              'privacy-policy/index.html','services/index.html','sunday-school/index.html','terms-and-conditions/index.html'
          ]
          texts=[Path(p).read_text() for p in routes]
          header=Path('Site Header.dc.html').read_text()
          footer=Path('Site Footer.dc.html').read_text()
          inquiry=Path('Inquiry Form.dc.html').read_text()
          css=(Path('assets/site.css').read_text()+Path('assets/rendered-corrections.css').read_text())
          js=Path('assets/site.js').read_text()
          home=Path('index.html').read_text()

          check('all public routes use v17 assets', all('20260914-17' in t and '20260913-16' not in t and '20260913-14' not in t for t in texts))
          check('site.js fallback uses v17 correction CSS', '20260914-17' in js and '20260913-14' not in js)
          check('success title source is uppercase Inter Tight', 'YOUR INQUIRY IS IN.</h2>' in header and "font-family:'Inter Tight'" in header[header.find('YOUR INQUIRY IS IN.')-350:header.find('YOUR INQUIRY IS IN.')])
          check('old success title removed', 'Your Inquiry Is In.</h2>' not in header)
          check('success body source is Inter Tight', "font-family:'Inter Tight'" in header[header.find('Thank you for sharing the details.')-250:header.find('Thank you for sharing the details.')])
          check('newsletter fine print source is 8.25px/300', 'data-news-fineprint' in footer and 'font-size:8.25px' in footer and 'font-weight:300' in footer)
          check('focus-visible utility rule exists across shared CSS', ':focus-visible' in css and '#945650' in css)
          check('archive mobile header is 7.5px', 'font-size:7.5px;\n    letter-spacing:.125em;' in Path('assets/rendered-corrections.css').read_text())
          check('OPEN sign no decorative pointer cursor', '<div data-sign="true" style="cursor:pointer' not in home)
          check('OPEN sign inline click replay removed', "sign.addEventListener('click', this._signClick)" not in home)
          check('OPEN sign global click replay removed', "target.closest('[data-sign]')" not in js)
          check('Contact privacy notice preserved', 'By submitting this form, you acknowledge our' in Path('contact/index.html').read_text())
          check('Inquiry privacy notice preserved', 'By submitting this form, you acknowledge our' in inquiry)
          check('Petti original teal preserved', '#35807e' in Path('our-work/petti-pathways/index.html').read_text().lower() and '#2f7472' not in Path('our-work/petti-pathways/index.html').read_text().lower())

          dirs = ['about','accessibility','contact','cookie-policy','join-our-team','our-work','our-work/folake','our-work/luckys-cafe-bakery','our-work/petti-pathways','our-work/pizzeria-coco','privacy-policy','services','sunday-school','terms-and-conditions']
          drift=[]
          for name in ['Inquiry Form.dc.html','Site Footer.dc.html','Site Header.dc.html']:
              root=Path(name).read_bytes()
              for d in dirs:
                  p=Path(d)/name
                  if p.read_bytes()!=root: drift.append(str(p))
          check('all 42 page-local shared components match canonical roots', not drift, f'drift={drift[:5]} count={len(drift)}')

          if failures:
              raise SystemExit('\n'.join(failures))
          PY

      - name: Install WebKit
        run: |
          mkdir -p /tmp/sunday-fix-qa
          npm install --prefix /tmp/sunday-fix-qa playwright@1.55.0 >/dev/null 2>&1
          /tmp/sunday-fix-qa/node_modules/.bin/playwright install --with-deps webkit

      - name: Serve candidate
        run: |
          python -m http.server 4173 >/tmp/sunday-fix-http.log 2>&1 &
          sleep 2

      - name: Rendered WebKit verification
        run: |
          cat > /tmp/sunday-fix-qa.cjs <<'JS'
          const { webkit } = require('/tmp/sunday-fix-qa/node_modules/playwright');
          const base='http://127.0.0.1:4173';
          const routes=['/','/about/','/accessibility/','/contact/','/cookie-policy/','/join-our-team/','/our-work/','/our-work/folake/','/our-work/luckys-cafe-bakery/','/our-work/petti-pathways/','/our-work/pizzeria-coco/','/privacy-policy/','/services/','/sunday-school/','/terms-and-conditions/'];
          const failures=[];
          function check(name, ok, detail=''){ console.log(`${ok?'PASS':'FAIL'} | ${name}${detail?' | '+detail:''}`); if(!ok) failures.push(name+(detail?' :: '+detail:'')); }
          async function closeReservation(page){ const c=page.locator('[aria-label="The Sunday Reservation"] button[aria-label="Close"]'); if(await c.count() && await c.first().isVisible().catch(()=>false)) await c.first().click(); }
          async function openInquiry(page){
            const direct=page.getByRole('button',{name:'Reserve Your Seat'});
            for(let i=0;i<await direct.count();i++){ if(await direct.nth(i).isVisible().catch(()=>false)){ await direct.nth(i).click(); return; } }
            const menu=page.getByRole('button',{name:'Open menu'}); await menu.click(); await page.locator('[data-sheet-cta]').filter({hasText:'Reserve Your Seat'}).click();
          }
          (async()=>{
            const browser=await webkit.launch();
            const page=await browser.newPage({viewport:{width:390,height:844}});
            for(const route of routes){
              await page.goto(base+route,{waitUntil:'networkidle',timeout:60000}); await page.waitForTimeout(250); await closeReservation(page);
              check(`${route} html lang`,await page.locator('html').getAttribute('lang')==='en');
              check(`${route} main-content`,await page.locator('main#main-content[tabindex="-1"]').count()===1);
              check(`${route} visible H1`,await page.locator('h1:visible').count()>=1);
              check(`${route} image alt`,await page.locator('img:not([alt])').count()===0);
              const email=page.locator('footer a[href^="mailto:hello@sundayandcompany.co"]').first();
              const es=await email.evaluate(el=>({size:getComputedStyle(el).fontSize,weight:getComputedStyle(el).fontWeight,family:getComputedStyle(el).fontFamily}));
              check(`${route} footer email size`,parseFloat(es.size)>=15.4,JSON.stringify(es));
              check(`${route} footer email weight`,es.weight==='400',JSON.stringify(es));
              const fine=page.locator('[aria-label="Newsletter"] [data-news-fineprint]').first();
              if(await fine.count()){ const fsx=await fine.evaluate(el=>({size:getComputedStyle(el).fontSize,weight:getComputedStyle(el).fontWeight})); check(`${route} newsletter fine print`,parseFloat(fsx.size)>=8.2 && fsx.weight==='300',JSON.stringify(fsx)); }
            }

            await page.goto(base+'/',{waitUntil:'networkidle',timeout:60000}); await page.waitForTimeout(250); await closeReservation(page); await openInquiry(page);
            const modal=page.locator('[aria-label="Project inquiry"]'); await modal.waitFor({state:'visible'}); await page.waitForTimeout(120);
            const rect=await modal.boundingBox(); check('mobile inquiry centered',!!rect && Math.abs((rect.y+rect.height/2)-422)<70,JSON.stringify(rect));
            const status=modal.locator('div[role="status"][aria-live="polite"]').last();
            const h=status.locator('h2'); const p=status.locator('p').last();
            const data={hText:(await h.textContent()||'').trim(),hFont:await h.evaluate(el=>getComputedStyle(el).fontFamily),pFont:await p.evaluate(el=>getComputedStyle(el).fontFamily)};
            check('inquiry success title/body treatment',data.hText==='YOUR INQUIRY IS IN.' && data.hFont.includes('Inter Tight') && data.pFont.includes('Inter Tight'),JSON.stringify(data));
            await page.keyboard.press('Escape'); await page.waitForTimeout(180);
            check('Escape closes inquiry',!(await modal.isVisible().catch(()=>false)));
            const active=await page.evaluate(()=>({text:(document.activeElement?.textContent||'').trim(),aria:document.activeElement?.getAttribute?.('aria-label')||'',visible:!!document.activeElement && !!(document.activeElement.offsetWidth||document.activeElement.offsetHeight||document.activeElement.getClientRects().length)}));
            check('focus returns to a visible upstream opener',active.visible && (/Reserve Your Seat|Menu/i.test(active.text)||/Open menu|Reserve Your Seat/i.test(active.aria)),JSON.stringify(active));

            const sign=page.locator('[data-sign]').first();
            const signState=await sign.evaluate(el=>({cursor:getComputedStyle(el).cursor,role:el.getAttribute('role'),tabindex:el.getAttribute('tabindex'),onclick:el.getAttribute('onclick')}));
            check('OPEN sign container is non-interactive decoration',signState.cursor!=='pointer' && !signState.role && signState.tabindex===null && signState.onclick===null,JSON.stringify(signState));
            check('OPEN sign keeps legitimate CTA',await sign.locator('button').count()===1);

            await page.goto(base+'/contact/',{waitUntil:'networkidle',timeout:60000}); await page.waitForTimeout(250); await closeReservation(page);
            const intro=page.getByText('More detail about our services, pricing and what happens after you inquire.',{exact:true});
            await intro.scrollIntoViewIfNeeded(); await page.evaluate(()=>window.scrollBy(0,260));
            const sticky=await intro.evaluate(el=>{let a=[],c=el;for(let i=0;c&&i<8;i++,c=c.parentElement){const p=getComputedStyle(c).position;if(p==='sticky'||p==='-webkit-sticky')a.push(p);}return a;});
            check('Contact FAQ stays non-sticky',sticky.length===0,JSON.stringify(sticky));

            await browser.close();
            if(failures.length){ console.error('\nFAILURES\n'+failures.join('\n')); process.exit(1); }
          })().catch(e=>{console.error(e);process.exit(2)});
          JS
          node /tmp/sunday-fix-qa.cjs

      - name: Commit verified fixes only after QA passes
        run: |
          git config user.name "Sunday-Co"
          git config user.email "hello@sundayandcompany.co"
          git add index.html assets/site.js assets/rendered-corrections.css Site\ Header.dc.html Site\ Footer.dc.html Inquiry\ Form.dc.html \
            about accessibility contact cookie-policy join-our-team our-work privacy-policy services sunday-school terms-and-conditions
          if git diff --cached --quiet; then
            echo "No candidate changes to commit."
            exit 0
          fi
          git commit -m "[skip netlify] Fix verified production claim gaps"
          git push origin HEAD:production-claim-fixes-2026-09-14
