name: Verified Production Claim Fixes

on:
  push:
    branches:
      - production-claim-fixes-2026-09-14
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fix-and-qa:
    if: ${{ !contains(github.event.head_commit.message, '[verified-site-fix]') }}
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout fix branch
        uses: actions/checkout@v4
        with:
          ref: production-claim-fixes-2026-09-14
          fetch-depth: 0

      - name: Apply narrow production fixes and sync shared components
        run: |
          python - <<'PY'
          from pathlib import Path

          def ensure_replace(path, old, new):
              p = Path(path)
              s = p.read_text()
              if old in s:
                  p.write_text(s.replace(old, new, 1))
              elif new in s:
                  return
              else:
                  raise SystemExit(f"Neither expected old nor new text found in {path}: {old[:120]!r}")

          ensure_replace('Site Header.dc.html','<h2 style="font-size:clamp(28px,3vw,38px);font-weight:400;letter-spacing:-.045em;line-height:.94;margin:0">Your Inquiry Is In.</h2>','<h2 style="font-family:\'Inter Tight\',sans-serif;font-size:clamp(18px,2.2vw,24px);font-weight:500;letter-spacing:.12em;line-height:1.15;margin:0;text-transform:uppercase">YOUR INQUIRY IS IN.</h2>')
          ensure_replace('Site Header.dc.html','<p style="font-size:12px;line-height:1.5;margin:12px auto 0;max-width:520px">Thank you for sharing the details. We have received your inquiry and will review it before following up.</p>','<p style="font-family:\'Inter Tight\',sans-serif;font-size:11px;font-weight:300;letter-spacing:.02em;line-height:1.55;margin:12px auto 0;max-width:520px">Thank you for sharing the details. We have received your inquiry and will review it before following up.</p>')
          ensure_replace('Site Footer.dc.html','<p data-news-fineprint style="font-family:\'Inter Tight\',sans-serif;font-size:8px;letter-spacing:.055em;line-height:1.45;margin-top:7px;opacity:.78;text-transform:uppercase">','<p data-news-fineprint style="font-family:\'Inter Tight\',sans-serif;font-size:8.25px;font-weight:300;letter-spacing:.035em;line-height:1.45;margin-top:7px;opacity:.78;text-transform:uppercase">')
          ensure_replace('assets/rendered-corrections.css','font-size:7.25px;\n    letter-spacing:.125em;','font-size:7.5px;\n    letter-spacing:.125em;')
          ensure_replace('index.html','<div data-sign="true" style="cursor:pointer;margin:0 auto;max-width:{{ rbMax }};position:relative">','<div data-sign="true" style="margin:0 auto;max-width:{{ rbMax }};position:relative">')
          ensure_replace('index.html',"      this._signClick = () => this.nudgeSign(true);\n      sign.addEventListener('click', this._signClick);\n      this._signEl = sign;","      this._signEl = sign;")

          p=Path('assets/site.js'); s=p.read_text()
          click_block='''    if (!signMotionClickBound) {\n      document.addEventListener('click', function (event) {\n        var target = event.target;\n        if (target && target.closest && target.closest('[data-sign]')) {\n          triggerOriginalOpenSignMotion();\n        }\n      });\n      signMotionClickBound = true;\n    }\n\n'''
          if click_block in s: s=s.replace(click_block,'',1)
          elif "target.closest('[data-sign]')" in s: raise SystemExit('Unexpected OPEN sign click handling remains')
          s=s.replace("link.href = '/assets/rendered-corrections.css?v=20260913-14';","link.href = '/assets/rendered-corrections.css?v=20260914-17';")
          p.write_text(s)

          p=Path('assets/site.css'); s=p.read_text()
          service_footer_rule='''\n/* SERVICES FOOTER EMAIL · 2026-09-14\n   Narrow correction for the Services runtime utility-size collision. */\n@media (max-width: 700px) {\n  [data-screen-label="Services"] footer a[data-footer-ui][href^="mailto:"] {\n    font-size: 15.5px !important;\n    font-weight: 400 !important;\n    letter-spacing: 0 !important;\n  }\n}\n'''
          if service_footer_rule not in s: s += service_footer_rule
          p.write_text(s)

          routes=['index.html','about/index.html','accessibility/index.html','contact/index.html','cookie-policy/index.html','join-our-team/index.html','our-work/index.html','our-work/folake/index.html','our-work/luckys-cafe-bakery/index.html','our-work/petti-pathways/index.html','our-work/pizzeria-coco/index.html','privacy-policy/index.html','services/index.html','sunday-school/index.html','terms-and-conditions/index.html']
          for route in routes:
              p=Path(route); p.write_text(p.read_text().replace('20260913-16','20260914-17').replace('20260913-14','20260914-17'))

          dirs=['about','accessibility','contact','cookie-policy','join-our-team','our-work','our-work/folake','our-work/luckys-cafe-bakery','our-work/petti-pathways','our-work/pizzeria-coco','privacy-policy','services','sunday-school','terms-and-conditions']
          for name in ['Inquiry Form.dc.html','Site Footer.dc.html','Site Header.dc.html']:
              source=Path(name).read_bytes()
              for d in dirs: (Path(d)/name).write_bytes(source)
          PY

      - name: Static verification before browser QA
        run: |
          python - <<'PY'
          from pathlib import Path
          failures=[]
          def check(name,ok,detail=''):
              print(('PASS' if ok else 'FAIL')+' | '+name+((' | '+detail) if detail else ''))
              if not ok: failures.append(name)
          routes=['index.html','about/index.html','accessibility/index.html','contact/index.html','cookie-policy/index.html','join-our-team/index.html','our-work/index.html','our-work/folake/index.html','our-work/luckys-cafe-bakery/index.html','our-work/petti-pathways/index.html','our-work/pizzeria-coco/index.html','privacy-policy/index.html','services/index.html','sunday-school/index.html','terms-and-conditions/index.html']
          texts=[Path(p).read_text() for p in routes]; header=Path('Site Header.dc.html').read_text(); footer=Path('Site Footer.dc.html').read_text(); inquiry=Path('Inquiry Form.dc.html').read_text(); css=Path('assets/site.css').read_text()+Path('assets/rendered-corrections.css').read_text(); js=Path('assets/site.js').read_text(); home=Path('index.html').read_text()
          check('all public routes use v17 assets',all('20260914-17' in t and '20260913-16' not in t and '20260913-14' not in t for t in texts))
          check('site.js fallback uses v17','20260914-17' in js and '20260913-14' not in js)
          check('success title uppercase Inter Tight','YOUR INQUIRY IS IN.</h2>' in header and "font-family:'Inter Tight'" in header[header.find('YOUR INQUIRY IS IN.')-350:header.find('YOUR INQUIRY IS IN.')])
          check('old success title removed','Your Inquiry Is In.</h2>' not in header)
          check('success body Inter Tight',"font-family:'Inter Tight'" in header[header.find('Thank you for sharing the details.')-250:header.find('Thank you for sharing the details.')])
          check('newsletter source 8.25px/300','data-news-fineprint' in footer and 'font-size:8.25px' in footer and 'font-weight:300' in footer)
          check('focus utility preserved',':focus-visible' in css and '#945650' in css)
          check('archive mobile header 7.5px','font-size:7.5px;\n    letter-spacing:.125em;' in Path('assets/rendered-corrections.css').read_text())
          check('Services footer rule narrow','[data-screen-label="Services"] footer a[data-footer-ui][href^="mailto:"]' in Path('assets/site.css').read_text())
          check('OPEN sign non-pointer','<div data-sign="true" style="cursor:pointer' not in home)
          check('OPEN inline click removed',"sign.addEventListener('click', this._signClick)" not in home)
          check('OPEN global click removed',"target.closest('[data-sign]')" not in js)
          check('Contact privacy preserved','By submitting this form, you acknowledge our' in Path('contact/index.html').read_text())
          check('Inquiry privacy preserved','By submitting this form, you acknowledge our' in inquiry)
          petti=Path('our-work/petti-pathways/index.html').read_text().lower(); check('Petti teal preserved','#35807e' in petti and '#2f7472' not in petti)
          dirs=['about','accessibility','contact','cookie-policy','join-our-team','our-work','our-work/folake','our-work/luckys-cafe-bakery','our-work/petti-pathways','our-work/pizzeria-coco','privacy-policy','services','sunday-school','terms-and-conditions']; drift=[]
          for name in ['Inquiry Form.dc.html','Site Footer.dc.html','Site Header.dc.html']:
              root=Path(name).read_bytes()
              for d in dirs:
                  if (Path(d)/name).read_bytes()!=root: drift.append(str(Path(d)/name))
          check('42 shared copies synchronized',not drift,f'count={len(drift)}')
          if failures: raise SystemExit(', '.join(failures))
          PY

      - name: Install WebKit
        run: |
          mkdir -p /tmp/sunday-fix-qa
          npm install --prefix /tmp/sunday-fix-qa playwright@1.55.0 >/dev/null 2>&1
          /tmp/sunday-fix-qa/node_modules/.bin/playwright install --with-deps webkit

      - name: Serve candidate
        run: |
          python -m http.server 4173 >/tmp/sunday-fix-http.log 2>&1 &
          sleep 2

      - name: Rendered WebKit verification
        run: |
          cat > /tmp/sunday-fix-qa.cjs <<'JS'
          const { webkit }=require('/tmp/sunday-fix-qa/node_modules/playwright');
          const base='http://127.0.0.1:4173';
          const routes=['/','/about/','/accessibility/','/contact/','/cookie-policy/','/join-our-team/','/our-work/','/our-work/folake/','/our-work/luckys-cafe-bakery/','/our-work/petti-pathways/','/our-work/pizzeria-coco/','/privacy-policy/','/services/','/sunday-school/','/terms-and-conditions/'];
          const failures=[]; const check=(n,o,d='')=>{console.log(`${o?'PASS':'FAIL'} | ${n}${d?' | '+d:''}`);if(!o)failures.push(n+(d?' :: '+d:''));};
          async function closeReservation(page){const c=page.locator('[aria-label="The Sunday Reservation"] button[aria-label="Close"]');if(await c.count()&&await c.first().isVisible().catch(()=>false))await c.first().click();}
          async function openInquiry(page){const d=page.getByRole('button',{name:'Reserve Your Seat'});for(let i=0;i<await d.count();i++){if(await d.nth(i).isVisible().catch(()=>false)){await d.nth(i).click();return;}}const m=page.getByRole('button',{name:'Open menu'});await m.click();await page.locator('[data-sheet-cta]').filter({hasText:'Reserve Your Seat'}).click();}
          (async()=>{const browser=await webkit.launch();const page=await browser.newPage({viewport:{width:390,height:844}});
            for(const route of routes){await page.goto(base+route,{waitUntil:'networkidle',timeout:60000});await page.waitForTimeout(250);await closeReservation(page);check(`${route} html lang`,await page.locator('html').getAttribute('lang')==='en');check(`${route} main-content`,await page.locator('main#main-content[tabindex="-1"]').count()===1);check(`${route} visible H1`,await page.locator('h1:visible').count()>=1);check(`${route} image alt`,await page.locator('img:not([alt])').count()===0);const email=page.locator('footer a[href^="mailto:hello@sundayandcompany.co"]').first();const es=await email.evaluate(el=>({size:getComputedStyle(el).fontSize,weight:getComputedStyle(el).fontWeight,family:getComputedStyle(el).fontFamily}));check(`${route} footer email size`,parseFloat(es.size)>=15.4,JSON.stringify(es));check(`${route} footer email weight`,es.weight==='400',JSON.stringify(es));const fine=page.locator('[aria-label="Newsletter"] [data-news-fineprint]').first();if(await fine.count()){const x=await fine.evaluate(el=>({size:getComputedStyle(el).fontSize,weight:getComputedStyle(el).fontWeight}));check(`${route} newsletter fine print`,parseFloat(x.size)>=8.2&&x.weight==='300',JSON.stringify(x));}}
            await page.goto(base+'/',{waitUntil:'networkidle',timeout:60000});await page.waitForTimeout(250);await closeReservation(page);await openInquiry(page);const modal=page.locator('[aria-label="Project inquiry"]');await modal.waitFor({state:'visible'});await page.waitForTimeout(120);const rect=await modal.boundingBox();check('mobile inquiry centered',!!rect&&Math.abs((rect.y+rect.height/2)-422)<70,JSON.stringify(rect));const status=modal.locator('div[role="status"][aria-live="polite"]').last();const h=status.locator('h2');const p=status.locator('p').last();const data={hText:(await h.textContent()||'').trim(),hFont:await h.evaluate(el=>getComputedStyle(el).fontFamily),pFont:await p.evaluate(el=>getComputedStyle(el).fontFamily)};check('inquiry success treatment',data.hText==='YOUR INQUIRY IS IN.'&&data.hFont.includes('Inter Tight')&&data.pFont.includes('Inter Tight'),JSON.stringify(data));await page.keyboard.press('Escape');await page.waitForTimeout(180);check('Escape closes inquiry',!(await modal.isVisible().catch(()=>false)));const active=await page.evaluate(()=>({text:(document.activeElement?.textContent||'').trim(),aria:document.activeElement?.getAttribute?.('aria-label')||'',visible:!!document.activeElement&&!!(document.activeElement.offsetWidth||document.activeElement.offsetHeight||document.activeElement.getClientRects().length)}));check('focus returns to visible opener',active.visible&&(/Reserve Your Seat|Menu/i.test(active.text)||/Open menu|Reserve Your Seat/i.test(active.aria)),JSON.stringify(active));const sign=page.locator('[data-sign]').first();const ss=await sign.evaluate(el=>({cursor:getComputedStyle(el).cursor,role:el.getAttribute('role'),tabindex:el.getAttribute('tabindex'),onclick:el.getAttribute('onclick')}));check('OPEN container non-interactive',ss.cursor!=='pointer'&&!ss.role&&ss.tabindex===null&&ss.onclick===null,JSON.stringify(ss));check('OPEN keeps real CTA',await sign.locator('button').count()===1);
            await page.goto(base+'/contact/',{waitUntil:'networkidle',timeout:60000});await page.waitForTimeout(250);await closeReservation(page);const intro=page.getByText('More detail about our services, pricing and what happens after you inquire.',{exact:true});await intro.scrollIntoViewIfNeeded();await page.evaluate(()=>window.scrollBy(0,260));const sticky=await intro.evaluate(el=>{let a=[],c=el;for(let i=0;c&&i<8;i++,c=c.parentElement){const p=getComputedStyle(c).position;if(p==='sticky'||p==='-webkit-sticky')a.push(p);}return a;});check('Contact FAQ non-sticky',sticky.length===0,JSON.stringify(sticky));await browser.close();if(failures.length){console.error('\nFAILURES\n'+failures.join('\n'));process.exit(1);}})().catch(e=>{console.error(e);process.exit(2)});
          JS
          node /tmp/sunday-fix-qa.cjs

      - name: Commit verified fixes only after QA passes
        run: |
          git config user.name "Sunday-Co"
          git config user.email "hello@sundayandcompany.co"
          git add index.html assets/site.js assets/site.css assets/rendered-corrections.css Site\ Header.dc.html Site\ Footer.dc.html Inquiry\ Form.dc.html about accessibility contact cookie-policy join-our-team our-work privacy-policy services sunday-school terms-and-conditions
          if git diff --cached --quiet; then echo "No candidate changes to commit."; exit 0; fi
          git commit -m "[skip netlify] [verified-site-fix] Fix verified production claim gaps"
          git push origin HEAD:production-claim-fixes-2026-09-14
