name: Version Production Assets

on:
  push:
    branches:
      - rendered-corrections-2026-09-12
    paths:
      - 'scripts/final-tiny-corrections.py'
      - '.github/workflows/version-production-assets.yml'

permissions:
  contents: write

jobs:
  version-assets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: rendered-corrections-2026-09-12
          fetch-depth: 0

      - name: Apply remaining newsletter correction
        run: python3 scripts/final-tiny-corrections.py

      - name: Commit final production correction
        run: |
          git config user.name "Sunday-Co"
          git config user.email "hello@sundayandcompany.co"
          git add assets/site.css
          if git diff --cached --quiet; then
            echo "Newsletter correction already applied."
            exit 0
          fi
          git commit -m "Finalize newsletter functional sizing"
          git push origin HEAD:rendered-corrections-2026-09-12
