name: Version Production Assets

on:
  push:
    branches:
      - rendered-corrections-2026-09-12
    paths:
      - 'scripts/version-production-assets.py'
      - 'scripts/fix-mobile-program-cards.py'
      - 'scripts/final-source-corrections.py'
      - '.github/workflows/version-production-assets.yml'

permissions:
  contents: write

jobs:
  version-assets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: rendered-corrections-2026-09-12
          fetch-depth: 0

      - name: Apply final production source fixes
        run: |
          python3 scripts/version-production-assets.py
          python3 scripts/fix-mobile-program-cards.py
          python3 scripts/final-source-corrections.py

      - name: Commit rendered production corrections
        run: |
          git config user.name "Sunday-Co"
          git config user.email "hello@sundayandcompany.co"
          git add -A
          if git diff --cached --quiet; then
            echo "No production corrections needed updating."
            exit 0
          fi
          git commit -m "Apply final source typography and form corrections"
          git push origin HEAD:rendered-corrections-2026-09-12
