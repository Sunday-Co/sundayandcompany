name: Production Claim Audit

on:
  push:
    branches:
      - sync-live-shared-components-2026-09-14
    paths:
      - '.github/workflows/production-claim-audit.yml'

jobs:
  audit:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout audit branch with production history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Switch to current production main
        run: |
          git fetch origin main
          git checkout --detach origin/main
          echo "Auditing production commit $(git rev-parse HEAD)"

      - name: Static claim-by-claim audit
        run: |
          python - <<'PY'
          from pathlib import Path
          import re, json, sys

          failures=[]
          passes=[]
          def check(name, ok, detail=''):
              (passes if ok else failures).append({'name':name,'detail':detail})
              print(('PASS' if ok else 'FAIL') + ' | ' + name + ((' | '+detail) if detail else ''))

          routes = {
            '/':'index.html','/about/':'about/index.html','/accessibility/':'accessibility/index.html',
            '/contact/':'contact/index.html','/cookie-policy/':'cookie-policy/index.html',
            '/join-our-team/':'join-our-team/index.html','/our-work/':'our-work/index.html',
            '/our-work/folake/':'our-work/folake/index.html','/our-work/luckys-cafe-bakery/':'our-work/luckys-cafe-bakery/index.html',
            '/our-work/petti-pathways/':'our-work/petti-pathways/index.html','/our-work/pizzeria-coco/':'our-work/pizzeria-coco/index.html',
            '/privacy-policy/':'privacy-policy/index.html','/services/':'services/index.html','/sunday-school/':'sunday-school/index.html',
            '/terms-and-conditions/':'terms-and-conditions/index.html'
          }
          texts={r:Path(p).read_text() for r,p in routes.items()}
          css=Path('assets/site.css').read_text()
          rc=Path('assets/rendered-corrections.css').read_text()
          js=Path('assets/site.js').read_text()
          header=Path('Site Header.dc.html').read_text()
          footer=Path('Site Footer.dc.html').read_text()
          inquiry=Path('Inquiry Form.dc.html').read_text()

          # Structural/accessibility claims.
          check('HTML lang=en on all public routes', all(re.search(r'<html[^>]*\blang=["\']en["\']',t,re.I) for t in texts.values()))
          check('main-content target on all public routes', all('id="main-content"' in t and 'tabindex="-1"' in t for t in texts.values()))
          check('Skip link targets #main-content', 'href="#main-content"' in header)
          check('Keyboard focus management exists', all(k in js for k in ['sundayCurrentSurface','sundayFocusable','Escape','sundayRestoreOpener']))
          check('Intentional focus-visible outline rule exists', ':focus-visible' in css and '#945650' in css)
          check('Named keyboard scroll-region remediation exists', 'role="region"' in ''.join(texts.values()) or 'role="region"' in inquiry or 'role="region"' in header)
          check('Touch target coarse-pointer rule exists', 'pointer: coarse' in css or 'pointer:coarse' in css or 'pointer: coarse' in rc or 'pointer:coarse' in rc)

          # Forms/privacy/status claims.
          contact=texts['/contact/']
          check('Contact privacy acknowledgment exists', 'By submitting this form, you acknowledge our' in contact and '/privacy-policy' in contact)
          check('Inquiry final-step privacy acknowledgment exists', 'By submitting this form, you acknowledge our' in inquiry and '/privacy-policy' in inquiry)
          check('Newsletter email has accessible label', 'aria-label="Email address"' in footer)
          check('Newsletter completion uses status/live region', 'role="status"' in footer and 'aria-live="polite"' in footer)
          check('Inquiry completion uses status/live region', 'role="status"' in header and 'aria-live="polite"' in header)
          check('Newsletter fine print source is 8.25px/300', 'data-news-fineprint' in footer and ('font-size:8.25px' in footer or 'font-size:8.25px' in css) and ('font-weight:300' in footer or 'font-weight: 300' in css))

          # Actual inquiry success typography requested earlier.
          check('Actual Header success receipt uses new Inter Tight uppercase treatment', 'YOUR INQUIRY IS IN.' in header and "font-family:'Inter Tight'" in header[header.find('YOUR INQUIRY IS IN.')-300:header.find('YOUR INQUIRY IS IN.')+50], 'old serif receipt is a fail')
          check('Old title-case Header success receipt removed', 'Your Inquiry Is In.</h2>' not in header)

          # Footer claims.
          check('Footer email source weight 400', 'href="mailto:hello@sundayandcompany.co"' in footer and 'font-weight:400' in footer[footer.find('href="mailto:hello@sundayandcompany.co"'):footer.find('href="mailto:hello@sundayandcompany.co"')+400])
          check('Footer tagline source uses Inter Tight', 'data-footer-tagline' in footer and "font-family:'Inter Tight'" in footer[footer.find('data-footer-tagline'):footer.find('data-footer-tagline')+500])
          check('Mobile footer safe-area bottom padding >=44px rule exists', '44px + env(safe-area-inset-bottom)' in css)
          check('Mobile legal line-height 1.55 exists', 'line-height: 1.55' in css or 'line-height:1.55' in css or 'line-height: 1.55' in rc or 'line-height:1.55' in rc)

          # Color and page-specific claims.
          home=texts['/']
          join=texts['/join-our-team/']
          petti=texts['/our-work/petti-pathways/']
          check('Petti original teal #35807e preserved', '#35807e' in petti.lower() and '#2f7472' not in petti.lower())
          check('Join placeholder corrected to #7b7061', '#7b7061' in join.lower() or '#7b7061' in css.lower() or '#7b7061' in rc.lower())
          check('Lighter rose #c88f87 exists for espresso utility text', '#c88f87' in css.lower() or '#c88f87' in rc.lower() or '#c88f87' in footer.lower())
          check('Darker utility rose #945650 exists', '#945650' in css.lower() or '#945650' in rc.lower())
          check('Homepage active-service #955851 exists', '#955851' in home.lower() or '#955851' in css.lower() or '#955851' in rc.lower())
          check('Inquiry active/selected #955851 exists', '#955851' in inquiry.lower() or '#955851' in css.lower() or '#955851' in rc.lower())

          # Safari/image claims.
          check('General Safari image visibility safeguard exists', 'content-visibility: visible' in css or 'content-visibility:visible' in css or 'content-visibility: visible' in rc or 'content-visibility:visible' in rc)
          check('Static hero safeguard marker/rule exists', 'data-sunday-static-hero' in home and 'data-sunday-static-hero' in (css+rc))
          check('Homepage hero normal-flow Safari rule exists', 'data-screen-hero="home"' in home and ('normal flow' in css.lower() or 'normal flow' in rc.lower() or 'section#top[data-screen-hero="home"]' in css or 'section#top[data-screen-hero="home"]' in rc))

          # Media/performance and asset claims.
          portfolio=['/our-work/folake/','/our-work/luckys-cafe-bakery/','/our-work/petti-pathways/','/our-work/pizzeria-coco/']
          video_pages=[r for r in portfolio if '<video' in texts[r]]
          check('Portfolio videos use preload=metadata', all('preload="auto"' not in texts[r] and 'preload="metadata"' in texts[r] for r in video_pages), f'video routes={video_pages}')
          check('Public pages use reviewed v14 asset refs', all('20260913-14' in t for t in texts.values()))

          # OPEN sign semantics.
          sign_slice=''
          m=re.search(r'(<[^>]+data-sign[^>]*>.*?</[^>]+>)',home,re.S|re.I)
          if m: sign_slice=m.group(1)
          check('OPEN sign is present', 'data-sign' in home)
          check('OPEN sign has no obvious nested button/link semantics', not re.search(r'<(?:button|a)\b', sign_slice, re.I) if sign_slice else False)

          # Shared-component ownership/drift, the major newly discovered problem.
          dirs=['about','accessibility','contact','cookie-policy','join-our-team','our-work','our-work/folake','our-work/luckys-cafe-bakery','our-work/petti-pathways','our-work/pizzeria-coco','privacy-policy','services','sunday-school','terms-and-conditions']
          drift=[]
          for name in ['Inquiry Form.dc.html','Site Footer.dc.html','Site Header.dc.html']:
              root=Path(name).read_bytes()
              for d in dirs:
                  p=Path(d)/name
                  if not p.exists() or p.read_bytes()!=root:
                      drift.append(str(p))
          check('All 42 page-local shared components match canonical root owners', not drift, f'drift_count={len(drift)}; examples={drift[:8]}')

          # FAQ source should not explicitly opt into sticky behavior.
          check('Contact FAQ source has no sticky positioning', 'position:sticky' not in contact.replace(' ','').lower() and 'position:-webkit-sticky' not in contact.replace(' ','').lower())

          print('\nSTATIC_AUDIT_JSON=' + json.dumps({'passes':passes,'failures':failures}))
          # Do not stop runtime audit; preserve findings in a file.
          Path('/tmp/static-audit.json').write_text(json.dumps({'passes':passes,'failures':failures},indent=2))
          PY

      - name: Install WebKit
        run: |
          mkdir -p /tmp/prod-claim-audit
          npm install --prefix /tmp/prod-claim-audit playwright@1.55.0 >/dev/null 2>&1
          /tmp/prod-claim-audit/node_modules/.bin/playwright install --with-deps webkit

      - name: Serve production source locally
        run: |
          python -m http.server 4173 >/tmp/prod-claim-http.log 2>&1 &
          sleep 2

      - name: Rendered production audit
        run: |
          cat > /tmp/prod-audit.cjs <<'JS'
          const { webkit } = require('/tmp/prod-claim-audit/node_modules/playwright');
          const fs = require('node:fs');
          const base='http://127.0.0.1:4173';
          const routes=['/','/about/','/accessibility/','/contact/','/cookie-policy/','/join-our-team/','/our-work/','/our-work/folake/','/our-work/luckys-cafe-bakery/','/our-work/petti-pathways/','/our-work/pizzeria-coco/','/privacy-policy/','/services/','/sunday-school/','/terms-and-conditions/'];
          const passes=[], failures=[];
          function check(name, ok, detail='') { (ok?passes:failures).push({name,detail}); console.log(`${ok?'PASS':'FAIL'} | ${name}${detail?' | '+detail:''}`); }
          async function closeReservation(page){ const c=page.locator('[aria-label="The Sunday Reservation"] button[aria-label="Close"]'); if(await c.count() && await c.first().isVisible().catch(()=>false)) await c.first().click(); }
          async function openInquiry(page){
            const direct=page.getByRole('button',{name:'Reserve Your Seat'});
            for(let i=0;i<await direct.count();i++){ if(await direct.nth(i).isVisible().catch(()=>false)){ await direct.nth(i).click(); return direct.nth(i); } }
            const menu=page.getByRole('button',{name:'Open menu'}); if(await menu.isVisible().catch(()=>false)){ await menu.click(); const cta=page.locator('[data-sheet-cta]').filter({hasText:'Reserve Your Seat'}); await cta.click(); return menu; }
            throw new Error('no inquiry opener');
          }
          (async()=>{
            const browser=await webkit.launch();
            const page=await browser.newPage({viewport:{width:390,height:844}});
            for(const route of routes){
              try{
                await page.goto(base+route,{waitUntil:'networkidle',timeout:60000}); await page.waitForTimeout(350); await closeReservation(page);
                const htmlLang=await page.locator('html').getAttribute('lang'); check(`${route} html lang`, htmlLang==='en', String(htmlLang));
                check(`${route} main-content`, await page.locator('main#main-content[tabindex="-1"]').count()===1);
                const h1vis=await page.locator('h1:visible').count(); check(`${route} visible H1`, h1vis>=1, `count=${h1vis}`);
                const badAlt=await page.locator('img:not([alt])').count(); check(`${route} images have alt`, badAlt===0, `missing=${badAlt}`);
                const email=page.locator('footer a[href^="mailto:hello@sundayandcompany.co"]').first();
                await email.waitFor({state:'attached',timeout:10000});
                const es=await email.evaluate(el=>({size:getComputedStyle(el).fontSize,weight:getComputedStyle(el).fontWeight,family:getComputedStyle(el).fontFamily}));
                check(`${route} footer email weight`, es.weight==='400', JSON.stringify(es));
                check(`${route} footer email readable mobile size`, parseFloat(es.size)>=13.2, JSON.stringify(es));
                const tag=page.locator('footer [data-footer-tagline]').first();
                if(await tag.count()){ const tf=await tag.evaluate(el=>getComputedStyle(el).fontFamily); check(`${route} footer tagline Inter Tight`, tf.includes('Inter Tight'), tf); }
                const foot=page.locator('footer').first(); const pb=await foot.evaluate(el=>getComputedStyle(el).paddingBottom); check(`${route} footer bottom breathing room`, parseFloat(pb)>=44, pb);
                const fine=page.locator('[aria-label="Newsletter"] [data-news-fineprint]').first();
                if(await fine.count()){ const fsx=await fine.evaluate(el=>({size:getComputedStyle(el).fontSize,weight:getComputedStyle(el).fontWeight})); check(`${route} newsletter fine print`, parseFloat(fsx.size)>=8.2 && fsx.weight==='300', JSON.stringify(fsx)); }
              }catch(e){ check(`${route} route runtime audit completed`,false,e.message); }
            }

            // Inquiry modal geometry, actual success receipt, and focus restoration.
            try{
              await page.goto(base+'/',{waitUntil:'networkidle',timeout:60000}); await page.waitForTimeout(350); await closeReservation(page);
              const opener=await openInquiry(page); const modal=page.locator('[aria-label="Project inquiry"]'); await modal.waitFor({state:'visible'}); await page.waitForTimeout(120);
              const rect=await modal.boundingBox(); const centered=rect && Math.abs((rect.y+rect.height/2)-(844/2))<70; check('Mobile inquiry visually centered',!!centered,JSON.stringify(rect));
              const success=modal.locator('div[role="status"][aria-live="polite"]').last();
              if(await success.count()){
                const h=success.locator('h2'); const p=success.locator('p').last();
                const data={hText:(await h.textContent()||'').trim(),hFont:await h.evaluate(el=>getComputedStyle(el).fontFamily),pFont:await p.evaluate(el=>getComputedStyle(el).fontFamily)};
                check('Actual rendered inquiry success uses requested uppercase Inter Tight treatment',data.hText==='YOUR INQUIRY IS IN.' && data.hFont.includes('Inter Tight') && data.pFont.includes('Inter Tight'),JSON.stringify(data));
              } else check('Actual rendered inquiry success status exists',false,'missing');
              await page.keyboard.press('Escape'); await page.waitForTimeout(180); check('Escape closes inquiry',!(await modal.isVisible().catch(()=>false)));
              const active=await page.evaluate(()=>document.activeElement && (document.activeElement.textContent||document.activeElement.getAttribute('aria-label')||'').trim()); check('Inquiry close restores focus to opener',/Reserve Your Seat|Open menu/i.test(active||''),String(active));
            }catch(e){ check('Inquiry modal/focus audit completed',false,e.message); }

            // Contact FAQ behavior.
            try{
              await page.goto(base+'/contact/',{waitUntil:'networkidle',timeout:60000}); await page.waitForTimeout(350); await closeReservation(page);
              const intro=page.getByText('More detail about our services, pricing and what happens after you inquire.',{exact:true});
              await intro.scrollIntoViewIfNeeded(); await page.evaluate(()=>window.scrollBy(0,260)); await page.waitForTimeout(80);
              const sticky=await intro.evaluate(el=>{let a=[],c=el;for(let i=0;c&&i<8;i++,c=c.parentElement){const p=getComputedStyle(c).position;if(p==='sticky'||p==='-webkit-sticky')a.push({tag:c.tagName,cls:c.className,p});}return a;});
              check('Contact FAQ does not become sticky/overlap',sticky.length===0,JSON.stringify(sticky));
            }catch(e){ check('Contact FAQ runtime audit completed',false,e.message); }

            // OPEN sign semantics and focusable nested controls.
            try{
              await page.goto(base+'/',{waitUntil:'networkidle',timeout:60000}); await page.waitForTimeout(350); await closeReservation(page);
              const sign=page.locator('[data-sign]').first(); check('Rendered OPEN sign exists',await sign.count()===1);
              if(await sign.count()){ const nested=await sign.locator('a,button,[role="button"]').count(); check('OPEN sign has no nested interactive semantics',nested===0,`nested=${nested}`); }
            }catch(e){ check('OPEN sign runtime audit completed',false,e.message); }

            await browser.close();
            const out={passes,failures}; fs.writeFileSync('/tmp/runtime-audit.json',JSON.stringify(out,null,2)); console.log('\nRUNTIME_AUDIT_JSON='+JSON.stringify(out));
            if(failures.length) process.exitCode=1;
          })().catch(e=>{console.error(e);process.exit(2)});
          JS
          node /tmp/prod-audit.cjs || true

      - name: Print consolidated findings
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          s=json.loads(Path('/tmp/static-audit.json').read_text()) if Path('/tmp/static-audit.json').exists() else {'passes':[],'failures':[{'name':'static audit missing','detail':''}]}
          r=json.loads(Path('/tmp/runtime-audit.json').read_text()) if Path('/tmp/runtime-audit.json').exists() else {'passes':[],'failures':[{'name':'runtime audit missing','detail':''}]}
          failures=s['failures']+r['failures']
          print('\n=== PRODUCTION CLAIM AUDIT SUMMARY ===')
          print('Static passes:',len(s['passes']),'Static failures:',len(s['failures']))
          print('Runtime passes:',len(r['passes']),'Runtime failures:',len(r['failures']))
          print('\nFAILURES:')
          for i,f in enumerate(failures,1): print(f"{i}. {f['name']} :: {f.get('detail','')}")
          print('\nTOTAL FAILURES:',len(failures))
          PY
