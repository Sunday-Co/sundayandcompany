name: Final Sunday polish one pass

on:
  push:
    branches:
      - final-polish-no-deploy-2026-09-12

permissions:
  contents: write

jobs:
  polish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply and validate final polish
        run: |
          python .github/scripts/final_polish.py
          node --check assets/site.js
          git diff --check

      - name: Commit verified tree and remove temporary tooling
        run: |
          git config user.name "Sunday-Co"
          git config user.email "hello@sundayandcompany.co"
          git rm .github/workflows/final-polish-one-pass.yml .github/scripts/final_polish.py
          git add -A
          git diff --cached --check
          git commit -m "[skip ci] [skip netlify] Prepare final Sunday visual polish"
          git push origin HEAD:${GITHUB_REF_NAME}
