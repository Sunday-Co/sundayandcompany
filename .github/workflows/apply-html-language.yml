name: Apply HTML Language

on:
  push:
    branches:
      - footer-reader-accessibility-fix-no-deploy-2026-09-13
    paths:
      - '.github/scripts/apply_html_language.py'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply language declaration
        run: python .github/scripts/apply_html_language.py

      - name: Verify public pages
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          pages = [p for p in Path('.').rglob('*.html') if '.github' not in p.parts and not p.name.endswith('.dc.html')]
          assert pages
          for p in pages:
              text = p.read_text(encoding='utf-8')
              tags = re.findall(r'<html\b[^>]*>', text, flags=re.I)
              assert len(tags) == 1, (p, len(tags))
              assert re.search(r'\blang\s*=\s*["\']en["\']', tags[0], flags=re.I), p
          print(f'Verified lang=en on {len(pages)} public HTML pages.')
          PY

      - name: Commit source changes
        run: |
          git config user.name "Sunday-Co"
          git config user.email "hello@sundayandcompany.co"
          git add -u
          if git diff --cached --quiet; then
            echo "No source changes to commit."
            exit 0
          fi
          git commit -m "[skip netlify] Declare English page language sitewide"
          git push origin HEAD:footer-reader-accessibility-fix-no-deploy-2026-09-13
