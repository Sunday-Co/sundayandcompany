name: Imported Shared Components Live QA

on:
  push:
    branches:
      - sync-live-shared-components-2026-09-14
    paths:
      - '.github/scripts/fix_imported_shared_components.py'
      - '.github/workflows/imported-shared-components-live-qa.yml'

permissions:
  contents: write

jobs:
  verify:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply authoritative shared-component fix
        run: python .github/scripts/fix_imported_shared_components.py

      - name: Verify transformed source before browser QA
        run: |
          python - <<'PY'
          from pathlib import Path
          dirs = [
            'about','accessibility','contact','cookie-policy','join-our-team','our-work',
            'our-work/folake','our-work/luckys-cafe-bakery','our-work/petti-pathways',
            'our-work/pizzeria-coco','privacy-policy','services','sunday-school','terms-and-conditions'
          ]
          for name in ['Inquiry Form.dc.html','Site Footer.dc.html','Site Header.dc.html']:
              root = Path(name).read_bytes()
              for d in dirs:
                  p = Path(d) / name
                  assert p.read_bytes() == root, f'drift: {p}'
          print('All 42 page-local shared component copies match their root owners byte-for-byte.')

          header = Path('Site Header.dc.html').read_text()
          footer = Path('Site Footer.dc.html').read_text()
          css = Path('assets/site.css').read_text()
          assert 'YOUR INQUIRY IS IN.' in header
          assert "font-size:clamp(18px,2.2vw,24px)!important" in header
          assert "font-size:{{ footerEmailSize }}!important" in footer
          assert "footerEmailSize: n ? '16.5px' : '13.25px'" in footer
          assert 'font-size:8.25px!important;font-weight:300!important' in footer
          assert 'font-size: 16.5px !important;' in css

          public_pages = [Path('404.html')] + list(Path('.').glob('*/index.html')) + list(Path('our-work').glob('*/index.html'))
          stale = [str(p) for p in public_pages if p.exists() and '20260913-16' in p.read_text()]
          assert not stale, f'stale v16 asset refs: {stale}'
          print('Canonical source owners and reviewed asset version are correct.')
          PY
          git diff --check

      - name: Install Playwright WebKit
        run: |
          mkdir -p /tmp/sunday-live-path-qa
          npm install --prefix /tmp/sunday-live-path-qa playwright@1.55.0 >/dev/null 2>&1
          /tmp/sunday-live-path-qa/node_modules/.bin/playwright install --with-deps webkit

      - name: Serve candidate
        run: |
          python -m http.server 4173 >/tmp/sunday-live-path-http.log 2>&1 &
          sleep 2

      - name: Test the actual rendered runtime
        run: |
          cat > /tmp/live-path-qa.cjs <<'JS'
          const { webkit } = require('/tmp/sunday-live-path-qa/node_modules/playwright');
          const assert = require('node:assert');
          const fs = require('node:fs');

          const base = 'http://127.0.0.1:4173';
          const out = 'imported-live-path-qa';
          fs.mkdirSync(out, { recursive: true });
          const routes = ['/', '/about/', '/accessibility/', '/contact/', '/cookie-policy/', '/join-our-team/', '/our-work/', '/our-work/folake/', '/our-work/luckys-cafe-bakery/', '/our-work/petti-pathways/', '/our-work/pizzeria-coco/', '/privacy-policy/', '/services/', '/sunday-school/', '/terms-and-conditions/'];
          const px = v => parseFloat(v || '0');

          async function closeReservation(page) {
            const close = page.locator('[aria-label="The Sunday Reservation"] button[aria-label="Close"]');
            if (await close.count() && await close.first().isVisible().catch(() => false)) await close.first().click();
          }

          async function openInquiry(page) {
            const buttons = page.getByRole('button', { name: 'Reserve Your Seat' });
            for (let i = 0; i < await buttons.count(); i++) {
              if (await buttons.nth(i).isVisible().catch(() => false)) {
                await buttons.nth(i).click();
                return;
              }
            }
            const menu = page.getByRole('button', { name: 'Open menu' });
            if (await menu.isVisible().catch(() => false)) {
              await menu.click();
              const sheetCta = page.locator('[data-sheet-cta]').filter({ hasText: 'Reserve Your Seat' });
              await sheetCta.click();
              return;
            }
            throw new Error('Could not find a visible Project Inquiry opener');
          }

          (async () => {
            const browser = await webkit.launch();
            const context = await browser.newContext({ viewport: { width: 390, height: 844 } });
            const page = await context.newPage();
            const results = {};

            // Check the exact rendered footer typography across every real route.
            for (const route of routes) {
              await page.goto(base + route, { waitUntil: 'networkidle', timeout: 60000 });
              await page.waitForTimeout(450);
              await closeReservation(page);

              const footerEmail = page.locator('footer a[href^="mailto:hello@sundayandcompany.co"]');
              await footerEmail.waitFor({ state: 'attached' });
              const emailStyles = await footerEmail.evaluate(el => ({
                size: getComputedStyle(el).fontSize,
                weight: getComputedStyle(el).fontWeight,
                family: getComputedStyle(el).fontFamily,
              }));
              assert.ok(px(emailStyles.size) >= 16.4 && px(emailStyles.size) <= 16.6, `${route}: footer email rendered ${emailStyles.size}`);
              assert.strictEqual(emailStyles.weight, '400', `${route}: footer email weight ${emailStyles.weight}`);
              assert.ok(emailStyles.family.includes('Inter Tight'), `${route}: footer email family ${emailStyles.family}`);

              const fine = page.locator('[aria-label="Newsletter"] [data-news-fineprint]');
              await fine.waitFor({ state: 'attached' });
              const fineStyles = await fine.evaluate(el => ({
                size: getComputedStyle(el).fontSize,
                weight: getComputedStyle(el).fontWeight,
                opacity: getComputedStyle(el).opacity,
                family: getComputedStyle(el).fontFamily,
              }));
              assert.ok(px(fineStyles.size) >= 8.2 && px(fineStyles.size) <= 8.3, `${route}: newsletter disclaimer size ${fineStyles.size}`);
              assert.strictEqual(fineStyles.weight, '300', `${route}: newsletter disclaimer weight ${fineStyles.weight}`);
              assert.ok(parseFloat(fineStyles.opacity) <= .73, `${route}: newsletter disclaimer opacity ${fineStyles.opacity}`);
              assert.ok(fineStyles.family.includes('Inter Tight'), `${route}: disclaimer family ${fineStyles.family}`);

              results[route] = { emailStyles, fineStyles };
            }

            // Verify the ACTUAL Site Header success receipt the live modal switches to.
            await page.goto(base + '/sunday-school/', { waitUntil: 'networkidle', timeout: 60000 });
            await page.waitForTimeout(500);
            await closeReservation(page);
            await openInquiry(page);
            const modal = page.locator('[aria-label="Project inquiry"]');
            await modal.waitFor({ state: 'visible' });
            const liveSuccess = modal.locator('div[role="status"][aria-live="polite"]').last();
            await liveSuccess.waitFor({ state: 'attached' });
            const h2 = liveSuccess.locator('h2');
            const body = liveSuccess.locator('p').last();
            const successStyles = {
              headingText: (await h2.textContent()).trim(),
              bodyText: (await body.textContent()).trim(),
              headingFamily: await h2.evaluate(el => getComputedStyle(el).fontFamily),
              bodyFamily: await body.evaluate(el => getComputedStyle(el).fontFamily),
              headingTransform: await h2.evaluate(el => getComputedStyle(el).textTransform),
              bodyTransform: await body.evaluate(el => getComputedStyle(el).textTransform),
              headingSize: await h2.evaluate(el => getComputedStyle(el).fontSize),
              bodySize: await body.evaluate(el => getComputedStyle(el).fontSize),
              bodyWeight: await body.evaluate(el => getComputedStyle(el).fontWeight),
            };
            assert.strictEqual(successStyles.headingText, 'YOUR INQUIRY IS IN.');
            assert.ok(successStyles.bodyText.startsWith('THANK YOU FOR SHARING THE DETAILS.'));
            assert.ok(successStyles.headingFamily.includes('Inter Tight'), successStyles.headingFamily);
            assert.ok(successStyles.bodyFamily.includes('Inter Tight'), successStyles.bodyFamily);
            assert.strictEqual(successStyles.headingTransform, 'uppercase');
            assert.strictEqual(successStyles.bodyTransform, 'uppercase');
            assert.ok(px(successStyles.headingSize) <= 24, successStyles.headingSize);
            assert.ok(px(successStyles.bodySize) <= 10.1, successStyles.bodySize);
            assert.strictEqual(successStyles.bodyWeight, '300');

            // Reveal the actual success receipt without submitting another inquiry/email.
            await modal.locator('div[style*="display:"][style*="text-align:left"]').first().evaluate(el => { el.style.display = 'none'; }).catch(() => {});
            await modal.locator('dc-import[name="/Inquiry Form"]').evaluate(el => { const p = el.parentElement; if (p) p.style.display = 'none'; }).catch(() => {});
            await liveSuccess.evaluate(el => { el.style.display = 'block'; });
            await page.waitForTimeout(120);
            await modal.screenshot({ path: `${out}/01-actual-live-inquiry-success-mobile.png` });

            // Footer proof from Sunday School, matching the user's live screenshot context.
            await page.goto(base + '/sunday-school/', { waitUntil: 'networkidle', timeout: 60000 });
            await page.waitForTimeout(450);
            await closeReservation(page);
            const footer = page.locator('footer');
            await footer.scrollIntoViewIfNeeded();
            await page.waitForTimeout(100);
            await page.screenshot({ path: `${out}/02-sunday-school-footer-mobile.png`, fullPage: false });

            // Contact FAQ must scroll normally and never become sticky/overlap.
            await page.goto(base + '/contact/', { waitUntil: 'networkidle', timeout: 60000 });
            await page.waitForTimeout(450);
            await closeReservation(page);
            const intro = page.getByText('More detail about our services, pricing and what happens after you inquire.', { exact: true });
            await intro.scrollIntoViewIfNeeded();
            await page.evaluate(() => window.scrollBy(0, 260));
            await page.waitForTimeout(120);
            const stickyAncestors = await intro.evaluate(el => {
              const rows = [];
              let cur = el;
              for (let i = 0; cur && i < 6; i++, cur = cur.parentElement) {
                const p = getComputedStyle(cur).position;
                if (p === 'sticky' || p === '-webkit-sticky') rows.push({ tag: cur.tagName, cls: cur.className || '', position: p });
              }
              return rows;
            });
            assert.strictEqual(stickyAncestors.length, 0, `FAQ still has sticky ancestor: ${JSON.stringify(stickyAncestors)}`);
            await page.screenshot({ path: `${out}/03-contact-faq-scrolled-mobile.png`, fullPage: false });

            console.log(JSON.stringify({ results, successStyles, stickyAncestors }, null, 2));
            await browser.close();
          })().catch(err => { console.error(err); process.exit(1); });
          JS
          node /tmp/live-path-qa.cjs

      - name: Upload proof screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: imported-live-path-qa
          path: imported-live-path-qa
          if-no-files-found: warn

      - name: Commit only verified website source
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/site.css 'Inquiry Form.dc.html' 'Site Footer.dc.html' 'Site Header.dc.html'
          find . -name '*.html' -not -path './.git/*' -not -path './.github/*' -not -path './node_modules/*' -print0 | xargs -0 git add --
          git diff --cached --check
          if git diff --cached --quiet; then
            echo 'No verified website changes to commit'
            exit 0
          fi
          git commit -m '[skip netlify] Fix actual imported shared component sources'
          git push
