name: Mobile Form Focus Stability QA

on:
  push:
    branches:
      - mobile-form-focus-stability-2026-09-14

permissions:
  contents: write

jobs:
  verify:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: mobile-form-focus-stability-2026-09-14
          fetch-depth: 0

      - name: Apply focus-stability candidate
        run: |
          python .github/scripts/mobile_form_focus_stability.py
          python - <<'PY'
          from pathlib import Path
          p = Path('assets/rendered-corrections.css')
          p.write_text(p.read_text().rstrip() + '\n')
          PY

      - name: Validate diff
        run: git diff --check

      - name: Install WebKit
        run: |
          mkdir -p /tmp/sunday-focus
          npm install --prefix /tmp/sunday-focus playwright@1.55.0 >/dev/null 2>&1
          /tmp/sunday-focus/node_modules/.bin/playwright install --with-deps webkit

      - name: Serve candidate
        run: |
          python -m http.server 4173 >/tmp/sunday-focus-http.log 2>&1 &
          sleep 2

      - name: Run rendered mobile focus QA
        run: |
          mkdir -p qa-artifacts
          node .github/scripts/mobile_form_focus_stability_qa.cjs

      - name: Upload QA screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mobile-form-focus-stability-qa
          path: qa-artifacts
          if-no-files-found: warn

      - name: Commit verified website source
        run: |
          git config user.name "Sunday-Co"
          git config user.email "hello@sundayandcompany.co"
          git add . ':!.github' ':!qa-artifacts'
          if git diff --cached --quiet; then
            echo "No website changes to commit"
            exit 0
          fi
          git commit -m "[skip netlify] Stabilize mobile form focus and keyboard viewport"
          git push origin HEAD:mobile-form-focus-stability-2026-09-14
