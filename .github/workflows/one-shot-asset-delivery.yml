name: One-shot asset delivery prep

on:
  push:
    branches: ["delivery-fix-no-deploy-2026-09-12"]

permissions:
  contents: write

jobs:
  prepare:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Normalize production asset delivery
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          version = '20260912-6'
          css_line = f'<link rel="stylesheet" href="/assets/site.css?v={version}" />'
          correction_line = f'<link rel="stylesheet" data-sunday-rendered-corrections href="/assets/rendered-corrections.css?v={version}" />'
          js_line = f'<script defer data-sunday-site-js src="/assets/site.js?v={version}"></script>'

          css_pat = re.compile(r'<link\b[^>]*href=["\']/assets/site\.css\?v=[^"\']+["\'][^>]*>')
          correction_pat = re.compile(r'<link\b[^>]*href=["\']/assets/rendered-corrections\.css\?v=[^"\']+["\'][^>]*>')
          js_pat = re.compile(r'<script\b[^>]*src=["\']/assets/site\.js\?v=[^"\']+["\'][^>]*></script>')

          pages = []
          for path in sorted(Path('.').rglob('*.html')):
              if path.name.endswith('.dc.html'):
                  continue
              text = path.read_text(encoding='utf-8')
              if '/assets/site.js?v=' not in text:
                  continue
              pages.append(path)
              if len(css_pat.findall(text)) != 1:
                  raise SystemExit(f'{path}: site.css tag count is not 1')
              if len(js_pat.findall(text)) != 1:
                  raise SystemExit(f'{path}: site.js tag count is not 1')
              if len(correction_pat.findall(text)) > 1:
                  raise SystemExit(f'{path}: multiple correction stylesheet tags')
              text = css_pat.sub(css_line, text, count=1)
              if correction_pat.search(text):
                  text = correction_pat.sub(correction_line, text, count=1)
              else:
                  text = text.replace(css_line, css_line + '\n' + correction_line, 1)
              text = js_pat.sub(js_line, text, count=1)
              path.write_text(text, encoding='utf-8')

          if len(pages) != 16:
              raise SystemExit(f'Expected 16 production HTML pages, found {len(pages)}: {pages}')

          site_js_path = Path('assets/site.js')
          site_js = site_js_path.read_text(encoding='utf-8')
          old_fallback = '/assets/rendered-corrections.css?v=20260912-5'
          if site_js.count(old_fallback) != 1:
              raise SystemExit(f'assets/site.js old fallback count: {site_js.count(old_fallback)}')
          site_js_path.write_text(site_js.replace(old_fallback, f'/assets/rendered-corrections.css?v={version}', 1), encoding='utf-8')

          header_path = Path('Site Header.dc.html')
          header = header_path.read_text(encoding='utf-8')
          start = header.find("    if (typeof document !== 'undefined') {\n")
          anchor = header.find("    this._onScroll = () =>", start)
          if start < 0 or anchor < 0:
              raise SystemExit('Could not locate the temporary dynamic asset loader in Site Header.dc.html')
          loader_block = header[start:anchor]
          if "rendered-corrections.css?v=20260912-5" not in loader_block or "site.js?v=20260912-5" not in loader_block:
              raise SystemExit('Unexpected Site Header loader block; refusing to edit it')
          header_path.write_text(header[:start] + header[anchor:], encoding='utf-8')

          for path in pages:
              text = path.read_text(encoding='utf-8')
              required = [
                  f'/assets/site.css?v={version}',
                  f'/assets/rendered-corrections.css?v={version}',
                  f'/assets/site.js?v={version}',
                  'data-sunday-rendered-corrections',
                  'data-sunday-site-js',
              ]
              missing = [item for item in required if text.count(item) != 1]
              if missing:
                  raise SystemExit(f'{path}: missing or duplicated markers: {missing}')
              if '20260912-4' in text:
                  raise SystemExit(f'{path}: old v4 asset reference remains')

          header = header_path.read_text(encoding='utf-8')
          if 'rendered-corrections.css?v=20260912-5' in header or 'site.js?v=20260912-5' in header:
              raise SystemExit('Temporary Header delivery references remain')

          print('Validated 16 production pages:')
          for path in pages:
              print(path)
          PY

          node --check assets/site.js
          git diff --check

      - name: Commit verified tree and remove temporary workflow
        shell: bash
        run: |
          git config user.name "Sunday-Co"
          git config user.email "hello@sundayandcompany.co"
          git rm .github/workflows/one-shot-asset-delivery.yml
          git add -A
          git diff --cached --check
          git commit -m "[skip ci] [skip netlify] Prepare verified static asset delivery"
          git push origin HEAD:${GITHUB_REF_NAME}
