name: Restore Portfolio Behavior

on:
  push:
    branches:
      - portfolio-behavior-restore-no-deploy-2026-09-12

permissions:
  contents: write

jobs:
  restore:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Restore original portfolio behavior overrides
        run: |
          python - <<'PY'
          from pathlib import Path

          files = [Path('assets/site.css'), Path('assets/rendered-corrections.css')]
          changed = []

          for path in files:
              text = path.read_text()
              original = text

              # Keep the recent correction-layer motion disabled, but do not
              # disable the site's original data-reveal system used by the
              # portfolio case studies.
              text = text.replace(
                  '/* FINAL SOURCE ALIGNMENT · 2026-09-12 */\n[data-reveal],\n.sc-reveal,',
                  '/* FINAL SOURCE ALIGNMENT · 2026-09-12 */\n.sc-reveal,'
              )
              text = text.replace(
                  '/* FINAL SOURCE-ALIGNED REVISION · 2026-09-12 */\n\n/* Remove only recent correction-layer entrance/reveal motion. */\nform[data-inq] [data-step-panel],\n[data-service-body],\n[data-process-body],\naside[data-sheet-state="open"] nav > a,\naside[data-sheet-state="open"] [data-sheet-cta],\n[data-reveal],\n.sc-reveal,',
                  '/* FINAL SOURCE-ALIGNED REVISION · 2026-09-12 */\n\n/* Remove only recent correction-layer entrance/reveal motion. */\nform[data-inq] [data-step-panel],\n[data-service-body],\n[data-process-body],\naside[data-sheet-state="open"] nav > a,\naside[data-sheet-state="open"] [data-sheet-cta],\n.sc-reveal,'
              )

              # Restore each page shell's own original overflow behavior.
              text = text.replace(
                  '[data-screen-label] {\n  max-width:100% !important;\n  overflow:visible !important;\n}\n',
                  ''
              )

              if text != original:
                  path.write_text(text)
                  changed.append(str(path))

          # First run changes exactly two files; later validation-only runs change none.
          if len(changed) not in (0, 2):
              raise SystemExit(f'Expected 0 or 2 CSS files to change, changed: {changed}')

          for path in files:
              text = path.read_text()
              if '[data-screen-label] {\n  max-width:100% !important;\n  overflow:visible !important;\n}' in text:
                  raise SystemExit(f'Global page-shell overflow override remains in {path}')
              if 'FINAL SOURCE ALIGNMENT · 2026-09-12 */\n[data-reveal],' in text:
                  raise SystemExit(f'data-reveal still disabled in {path}')
              if 'aside[data-sheet-state="open"] [data-sheet-cta]' not in text:
                  raise SystemExit(f'Recent-motion neutralizer unexpectedly missing from {path}')

          lucky = Path('our-work/luckys-cafe-bakery/index.html').read_text()
          if 'data-reveal="true"' not in lucky:
              raise SystemExit('Original portfolio data-reveal markup missing')
          if "n.style.opacity = '0'" not in lucky or "translateY(20px)" not in lucky:
              raise SystemExit('Original portfolio reveal runtime missing')
          if 'max-height:640px;overflow-y:auto' not in lucky:
              raise SystemExit('Original portfolio internal scroll frame missing')

          print('Portfolio behavior restoration source validation passed.')
          PY
      - name: Commit restored source
        run: |
          if git diff --quiet -- assets/site.css assets/rendered-corrections.css; then
            echo "No source changes to commit"
          else
            git config user.name "Sunday-Co"
            git config user.email "hello@sundayandcompany.co"
            git add assets/site.css assets/rendered-corrections.css
            git commit -m "[skip netlify] Restore original portfolio behavior"
            git push origin HEAD
          fi
      - name: Install WebKit
        run: |
          npm install --no-save playwright@1.55.0
          npx playwright install --with-deps webkit
      - name: Serve site
        run: |
          python3 -m http.server 4173 >/tmp/sunday-portfolio.log 2>&1 &
          echo $! >/tmp/sunday-portfolio.pid
          sleep 2
      - name: Verify original portfolio movement and frames
        run: |
          node <<'NODE'
          const { webkit } = require('playwright');
          const assert = require('assert');

          (async () => {
            const browser = await webkit.launch();
            const page = await browser.newPage({ viewport: { width: 390, height: 844 } });
            await page.goto('http://127.0.0.1:4173/our-work/luckys-cafe-bakery/', { waitUntil: 'domcontentloaded' });
            await page.waitForTimeout(1100);

            const reservationClose = page.locator('[aria-label="The Sunday Reservation"] button[aria-label="Close"]');
            if (await reservationClose.count() && await reservationClose.first().isVisible().catch(() => false)) {
              await reservationClose.first().evaluate(el => el.click());
              await page.waitForTimeout(200);
            }

            const target = page.locator('#email');
            await target.waitFor();
            const before = await target.evaluate(el => ({
              inlineOpacity: el.style.opacity,
              inlineTransform: el.style.transform,
              transitionDuration: getComputedStyle(el).transitionDuration,
              top: el.getBoundingClientRect().top
            }));
            assert.strictEqual(before.inlineOpacity, '0', `Expected original reveal to initialize hidden, got ${JSON.stringify(before)}`);
            assert.ok(before.inlineTransform.includes('translateY'), `Expected original translate reveal, got ${JSON.stringify(before)}`);
            assert.notStrictEqual(before.transitionDuration, '0s', `Original reveal transition was still disabled: ${JSON.stringify(before)}`);

            await target.scrollIntoViewIfNeeded();
            await page.waitForTimeout(1000);
            const after = await target.evaluate(el => ({
              inlineOpacity: el.style.opacity,
              inlineTransform: el.style.transform,
              computedOpacity: getComputedStyle(el).opacity
            }));
            assert.strictEqual(after.inlineOpacity, '1', `Reveal did not complete after scroll: ${JSON.stringify(after)}`);
            assert.strictEqual(after.computedOpacity, '1', `Reveal is still visually suppressed: ${JSON.stringify(after)}`);

            const frame = page.locator('img[alt="Lucky’s Café and Bakery homepage"]').locator('..');
            const frameStyle = await frame.evaluate(el => ({
              maxHeight: getComputedStyle(el).maxHeight,
              overflowY: getComputedStyle(el).overflowY
            }));
            assert.strictEqual(frameStyle.maxHeight, '640px', `Portfolio frame height changed: ${JSON.stringify(frameStyle)}`);
            assert.ok(['auto','scroll'].includes(frameStyle.overflowY), `Portfolio frame scrolling changed: ${JSON.stringify(frameStyle)}`);

            const shell = page.locator('[data-screen-label^="Our Work"]').first();
            const shellOverflow = await shell.evaluate(el => getComputedStyle(el).overflow);
            assert.notStrictEqual(shellOverflow, 'visible', 'Portfolio page shell is still globally forced to overflow:visible');

            await browser.close();
            console.log('Original portfolio movement and scroll-frame behavior verified in WebKit.');
          })().catch(err => { console.error(err); process.exit(1); });
          NODE
