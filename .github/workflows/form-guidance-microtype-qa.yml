name: Form Guidance Microtype QA

on:
  push:
    branches:
      - mobile-typography-faq-hotfix-2026-09-13
    paths:
      - '.github/scripts/apply_form_guidance_microtype.py'
      - '.github/workflows/form-guidance-microtype-qa.yml'

permissions:
  contents: write

jobs:
  apply-and-qa:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply source-level form guidance fixes
        run: python .github/scripts/apply_form_guidance_microtype.py

      - name: Validate source diff
        run: |
          git diff --check
          if grep -R --include='*.html' --exclude-dir='.git' --exclude-dir='.github' --exclude-dir='node_modules' -n '20260913-15' .; then
            echo 'Old v15 asset reference remains'
            exit 1
          fi

      - name: Install Playwright WebKit outside repository
        run: |
          mkdir -p /tmp/sunday-qa
          npm install --prefix /tmp/sunday-qa playwright@1.55.0 >/dev/null 2>&1
          /tmp/sunday-qa/node_modules/.bin/playwright install --with-deps webkit

      - name: Serve candidate
        run: |
          python -m http.server 4173 >/tmp/sunday-form-guidance-http.log 2>&1 &
          echo $! > /tmp/sunday-form-guidance-http.pid
          sleep 2

      - name: Run computed-style WebKit QA and screenshots
        run: |
          cat > /tmp/form-guidance-qa.cjs <<'JS'
          const { webkit } = require('/tmp/sunday-qa/node_modules/playwright');
          const assert = require('node:assert');
          const fs = require('node:fs');

          const base = 'http://127.0.0.1:4173';
          const out = 'form-guidance-qa';
          fs.mkdirSync(out, { recursive: true });

          const px = value => parseFloat(value || '0');

          async function allPlaceholderData(page) {
            return page.evaluate(() => [...document.querySelectorAll('form input[placeholder], form textarea[placeholder]')]
              .filter(el => el.type !== 'hidden')
              .map(el => ({
                name: el.name || el.id || '',
                placeholder: el.getAttribute('placeholder') || '',
                fieldSize: getComputedStyle(el).fontSize,
                placeholderSize: getComputedStyle(el, '::placeholder').fontSize,
                family: getComputedStyle(el, '::placeholder').fontFamily,
              })));
          }

          async function assertPlaceholderSystem(page, route) {
            await page.goto(base + route, { waitUntil: 'networkidle', timeout: 60000 });
            await page.waitForTimeout(900);
            const rows = await allPlaceholderData(page);
            assert.ok(rows.length >= 2, `${route}: expected shared placeholders, found ${rows.length}`);
            for (const row of rows) {
              assert.strictEqual(px(row.placeholderSize), 12, `${route} ${row.name}/${row.placeholder}: placeholder ${row.placeholderSize}`);
              assert.ok(px(row.fieldSize) >= 16, `${route} ${row.name}: entered text ${row.fieldSize}`);
              assert.ok(row.family.includes('Inter Tight'), `${route} ${row.name}: placeholder family ${row.family}`);
            }
            return rows;
          }

          (async () => {
            const browser = await webkit.launch();
            const context = await browser.newContext({ viewport: { width: 390, height: 844 } });
            const page = await context.newPage();

            // Reservation popup: this is a true placeholder inside a box.
            await page.goto(base + '/', { waitUntil: 'networkidle', timeout: 60000 });
            await page.waitForTimeout(1000);
            const reservation = page.locator('[aria-label="The Sunday Reservation"]');
            await reservation.waitFor({ state: 'attached' });
            const reservationInput = reservation.locator('input[placeholder="you@example.com"]');
            const reservationLabel = reservation.locator('label[for="reservationEmail"]');
            const resStyles = await reservationInput.evaluate(el => ({
              field: getComputedStyle(el).fontSize,
              placeholder: getComputedStyle(el, '::placeholder').fontSize,
            }));
            const resLabelSize = await reservationLabel.evaluate(el => getComputedStyle(el).fontSize);
            assert.strictEqual(px(resStyles.field), 16);
            assert.strictEqual(px(resStyles.placeholder), 12);
            assert.strictEqual(px(resLabelSize), 9.25);
            await page.screenshot({ path: `${out}/01-reservation-fields-mobile.png`, fullPage: false });

            // Close reservation and open the real project inquiry. No submission is sent.
            const close = reservation.locator('button[aria-label="Close"]');
            if (await close.isVisible().catch(() => false)) await close.click();
            const start = page.getByText('Start A Project', { exact: true }).first();
            await start.evaluate(el => el.click());
            const inquiry = page.locator('[aria-label="Project inquiry"]');
            await inquiry.waitFor({ state: 'visible' });
            const form = inquiry.locator('form[data-inq]');
            await form.locator('input[name="name"]').fill('QA Test');
            await form.locator('input[name="email"]').fill('qa@example.com');
            await form.locator('input[name="phone"]').fill('2025550123');
            await form.locator('input[name="business"]').fill('QA Studio');
            await form.locator('[data-stepbtns] button').click();
            await page.waitForTimeout(120);
            const website = form.locator('input[name="website"]');
            const budget = form.locator('input[name="budget"]');
            const websiteLabel = website.locator('xpath=ancestor::label[1]/span[1]');
            const dateTrigger = form.locator('[aria-haspopup="dialog"]').first();
            const projectStyles = {
              websiteField: await website.evaluate(el => getComputedStyle(el).fontSize),
              websitePlaceholder: await website.evaluate(el => getComputedStyle(el, '::placeholder').fontSize),
              budgetPlaceholder: await budget.evaluate(el => getComputedStyle(el, '::placeholder').fontSize),
              label: await websiteLabel.evaluate(el => getComputedStyle(el).fontSize),
              dateTrigger: await dateTrigger.evaluate(el => getComputedStyle(el).fontSize),
            };
            assert.strictEqual(px(projectStyles.websiteField), 16);
            assert.strictEqual(px(projectStyles.websitePlaceholder), 12);
            assert.strictEqual(px(projectStyles.budgetPlaceholder), 12);
            assert.strictEqual(px(projectStyles.label), 9.25);
            assert.strictEqual(px(projectStyles.dateTrigger), 12.5);
            await page.screenshot({ path: `${out}/02-project-inquiry-guidance-mobile.png`, fullPage: false });

            // Close inquiry so route changes are clean.
            const inquiryClose = inquiry.locator('button[aria-label="Close"]');
            if (await inquiryClose.count()) await inquiryClose.first().click().catch(() => {});

            // Contact: visible field labels must actually compute smaller.
            await page.goto(base + '/contact/', { waitUntil: 'networkidle', timeout: 60000 });
            await page.waitForTimeout(800);
            const contactLabel = page.locator('[data-screen-label="Contact"] form[data-editorial-labels] label > span').first();
            const contactInput = page.locator('[data-screen-label="Contact"] form[data-editorial-labels] input[name="name"]');
            assert.strictEqual(px(await contactLabel.evaluate(el => getComputedStyle(el).fontSize)), 9.25);
            assert.strictEqual(px(await contactInput.evaluate(el => getComputedStyle(el).fontSize)), 16);

            // Join: label plus placeholder-like custom listbox trigger.
            await page.goto(base + '/join-our-team/', { waitUntil: 'networkidle', timeout: 60000 });
            await page.waitForTimeout(800);
            const joinForm = page.locator('#program-interest form[data-editorial-labels]');
            const joinLabel = joinForm.locator('label > span').first();
            const joinSelect = joinForm.locator('[aria-haspopup="listbox"]').first();
            assert.strictEqual(px(await joinLabel.evaluate(el => getComputedStyle(el).fontSize)), 9.25);
            assert.strictEqual(px(await joinSelect.evaluate(el => getComputedStyle(el).fontSize)), 12.5);

            // Sunday School plus shared footer newsletter.
            await page.goto(base + '/sunday-school/', { waitUntil: 'networkidle', timeout: 60000 });
            await page.waitForTimeout(800);
            const schoolInput = page.locator('#school-notes-email');
            const schoolLabel = page.locator('label[for="school-notes-email"]');
            assert.strictEqual(px(await schoolInput.evaluate(el => getComputedStyle(el).fontSize)), 16);
            assert.strictEqual(px(await schoolInput.evaluate(el => getComputedStyle(el, '::placeholder').fontSize)), 12);
            assert.strictEqual(px(await schoolLabel.evaluate(el => getComputedStyle(el).fontSize)), 9.25);
            await schoolInput.scrollIntoViewIfNeeded();
            await page.waitForTimeout(120);
            await page.screenshot({ path: `${out}/03-sunday-school-field-mobile.png`, fullPage: false });

            const footerInput = page.locator('[aria-label="Newsletter"] input[placeholder="Email Address"]');
            assert.strictEqual(px(await footerInput.evaluate(el => getComputedStyle(el).fontSize)), 16);
            assert.strictEqual(px(await footerInput.evaluate(el => getComputedStyle(el, '::placeholder').fontSize)), 12);
            await footerInput.scrollIntoViewIfNeeded();
            await page.waitForTimeout(120);
            await page.screenshot({ path: `${out}/04-footer-newsletter-field-mobile.png`, fullPage: false });

            // Route-wide regression pass: every real placeholder remains 12px while entered text stays >=16px.
            const routeResults = {};
            for (const route of ['/', '/contact/', '/join-our-team/', '/sunday-school/', '/services/']) {
              routeResults[route] = await assertPlaceholderSystem(page, route);
            }

            await browser.close();
            console.log(JSON.stringify({ resStyles, resLabelSize, projectStyles, routeResults }, null, 2));
          })().catch(err => { console.error(err); process.exit(1); });
          JS
          node /tmp/form-guidance-qa.cjs

      - name: Upload QA screenshots
        uses: actions/upload-artifact@v4
        with:
          name: form-guidance-microtype-qa
          path: form-guidance-qa
          if-no-files-found: error

      - name: Commit verified website source only
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/site.css
          find . -name '*.html' -not -path './.git/*' -not -path './.github/*' -not -path './node_modules/*' -print0 | xargs -0 git add --
          if git diff --cached --quiet; then
            echo "No source changes to commit"
            exit 0
          fi
          git commit -m "[skip netlify] Apply verified form guidance microtype"
          git push
