name: Form Guidance Microtype QA

on:
  push:
    branches:
      - mobile-typography-faq-hotfix-2026-09-13
    paths:
      - '.github/scripts/apply_form_guidance_microtype.py'
      - '.github/workflows/form-guidance-microtype-qa.yml'

permissions:
  contents: write

jobs:
  apply-and-qa:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply source-level form guidance fixes
        run: python .github/scripts/apply_form_guidance_microtype.py

      - name: Validate source diff
        run: |
          git diff --check
          if grep -R --include='*.html' --exclude-dir='.git' --exclude-dir='.github' --exclude-dir='node_modules' -n '20260913-15' .; then
            echo 'Old v15 asset reference remains'
            exit 1
          fi

      - name: Install WebKit visual QA dependencies outside repository
        run: |
          mkdir -p /tmp/sunday-qa
          npm install --prefix /tmp/sunday-qa playwright@1.55.0 pngjs@7.0.0 >/dev/null 2>&1
          /tmp/sunday-qa/node_modules/.bin/playwright install --with-deps webkit

      - name: Serve candidate
        run: |
          python -m http.server 4173 >/tmp/sunday-form-guidance-http.log 2>&1 &
          echo $! > /tmp/sunday-form-guidance-http.pid
          sleep 2

      - name: Run rendered WebKit QA and screenshots
        run: |
          cat > /tmp/form-guidance-qa.cjs <<'JS'
          const { webkit } = require('/tmp/sunday-qa/node_modules/playwright');
          const { PNG } = require('/tmp/sunday-qa/node_modules/pngjs');
          const assert = require('node:assert');
          const fs = require('node:fs');

          const base = 'http://127.0.0.1:4173';
          const out = 'form-guidance-qa';
          fs.mkdirSync(out, { recursive: true });
          const px = value => parseFloat(value || '0');

          function pixelDiff(aBuffer, bBuffer) {
            const a = PNG.sync.read(aBuffer);
            const b = PNG.sync.read(bBuffer);
            assert.strictEqual(a.width, b.width, 'Screenshot widths differ');
            assert.strictEqual(a.height, b.height, 'Screenshot heights differ');
            let different = 0;
            for (let i = 0; i < a.data.length; i += 4) {
              if (
                a.data[i] !== b.data[i] ||
                a.data[i + 1] !== b.data[i + 1] ||
                a.data[i + 2] !== b.data[i + 2] ||
                a.data[i + 3] !== b.data[i + 3]
              ) different++;
            }
            return different;
          }

          async function paintProbe(page, locator, name) {
            const token = 'qa' + name.replace(/[^a-z0-9]/gi, '').toLowerCase();
            await locator.evaluate((el, value) => el.setAttribute('data-qa-placeholder', value), token);

            const capture = async suffix => {
              const buffer = await locator.screenshot();
              fs.writeFileSync(`${out}/${name}-${suffix}.png`, buffer);
              return buffer;
            };

            const setForcedSize = async size => {
              await page.evaluate(({ token, size }) => {
                let style = document.getElementById('qa-placeholder-paint-probe');
                if (!style) {
                  style = document.createElement('style');
                  style.id = 'qa-placeholder-paint-probe';
                  document.head.appendChild(style);
                }
                style.textContent = `[data-qa-placeholder="${token}"]::placeholder,[data-qa-placeholder="${token}"]::-webkit-input-placeholder{font-size:${size}px !important;}`;
              }, { token, size });
              await page.waitForTimeout(80);
            };

            const current = await capture('current');
            await setForcedSize(12);
            const forced12 = await capture('forced-12');
            await setForcedSize(16);
            const forced16 = await capture('forced-16');
            await setForcedSize(24);
            const forced24 = await capture('forced-24');

            const result = {
              currentVs12: pixelDiff(current, forced12),
              currentVs16: pixelDiff(current, forced16),
              currentVs24: pixelDiff(current, forced24),
              twelveVs16: pixelDiff(forced12, forced16),
              sixteenVs24: pixelDiff(forced16, forced24),
              fieldSize: await locator.evaluate(el => getComputedStyle(el).fontSize),
              reportedStandardPlaceholder: await locator.evaluate(el => getComputedStyle(el, '::placeholder').fontSize),
              reportedWebKitPlaceholder: await locator.evaluate(el => getComputedStyle(el, '::-webkit-input-placeholder').fontSize),
            };

            // Paint is the source of truth here. WebKit reports the parent input size for
            // placeholder pseudo-elements, so prove the actual painted pixels instead.
            assert.ok(result.currentVs12 <= 4, `${name}: current paint does not match forced 12px: ${JSON.stringify(result)}`);
            assert.ok(result.currentVs16 > 20, `${name}: current paint is too close to 16px: ${JSON.stringify(result)}`);
            assert.ok(result.currentVs24 > result.currentVs16, `${name}: 24px control did not diverge further: ${JSON.stringify(result)}`);
            assert.ok(result.twelveVs16 > 20, `${name}: 12px and 16px controls are not visually distinct: ${JSON.stringify(result)}`);
            assert.ok(result.sixteenVs24 > 20, `${name}: 16px and 24px controls are not visually distinct: ${JSON.stringify(result)}`);

            await page.evaluate(() => document.getElementById('qa-placeholder-paint-probe')?.remove());
            await locator.evaluate(el => el.removeAttribute('data-qa-placeholder'));
            await page.waitForTimeout(60);
            return result;
          }

          async function assertVisibleFieldTextAtLeast16(scope, context) {
            const sizes = await scope.locator('input:not([type="hidden"]), textarea, select').evaluateAll(elements => elements
              .filter(el => getComputedStyle(el).display !== 'none' && getComputedStyle(el).visibility !== 'hidden')
              .map(el => ({ name: el.name || el.id || el.tagName, size: getComputedStyle(el).fontSize })));
            for (const row of sizes) assert.ok(px(row.size) >= 16, `${context} ${row.name}: entered/control text ${row.size}`);
            return sizes;
          }

          (async () => {
            const browser = await webkit.launch();
            const context = await browser.newContext({ viewport: { width: 390, height: 844 } });
            const page = await context.newPage();
            const results = {};

            // Reservation popup.
            await page.goto(base + '/', { waitUntil: 'networkidle', timeout: 60000 });
            await page.waitForTimeout(1000);
            const reservation = page.locator('[aria-label="The Sunday Reservation"]');
            await reservation.waitFor({ state: 'visible' });
            const reservationInput = reservation.locator('input[placeholder="you@example.com"]');
            const reservationLabel = reservation.locator('label[for="reservationEmail"]');
            results.reservation = await paintProbe(page, reservationInput, '01-reservation-placeholder');
            assert.strictEqual(px(results.reservation.fieldSize), 16);
            assert.strictEqual(px(await reservationLabel.evaluate(el => getComputedStyle(el).fontSize)), 9.25);
            results.reservationFields = await assertVisibleFieldTextAtLeast16(reservation, 'Reservation');
            await page.screenshot({ path: `${out}/01-reservation-current-mobile.png`, fullPage: false });

            const close = reservation.locator('button[aria-label="Close"]');
            if (await close.isVisible().catch(() => false)) await close.click();

            // Project Inquiry: step 1 labels, then step 2 placeholders/date control.
            const start = page.getByText('Start A Project', { exact: true }).first();
            await start.evaluate(el => el.click());
            const inquiry = page.locator('[aria-label="Project inquiry"]');
            await inquiry.waitFor({ state: 'visible' });
            const form = inquiry.locator('form[data-inq]');
            const firstProjectLabel = form.locator('label > span').first();
            assert.strictEqual(px(await firstProjectLabel.evaluate(el => getComputedStyle(el).fontSize)), 9.25);
            await form.locator('input[name="name"]').fill('QA Test');
            await form.locator('input[name="email"]').fill('qa@example.com');
            await form.locator('input[name="phone"]').fill('2025550123');
            await form.locator('input[name="business"]').fill('QA Studio');
            await form.locator('[data-stepbtns] button').click();
            await page.waitForTimeout(160);
            const website = form.locator('input[name="website"]');
            const budget = form.locator('input[name="budget"]');
            const websiteLabel = website.locator('xpath=ancestor::label[1]/span[1]');
            const dateTrigger = form.locator('[aria-haspopup="dialog"]').first();
            results.projectWebsite = await paintProbe(page, website, '02-project-website-placeholder');
            results.projectBudget = await paintProbe(page, budget, '03-project-budget-placeholder');
            assert.strictEqual(px(results.projectWebsite.fieldSize), 16);
            assert.strictEqual(px(results.projectBudget.fieldSize), 16);
            assert.strictEqual(px(await websiteLabel.evaluate(el => getComputedStyle(el).fontSize)), 9.25);
            assert.strictEqual(px(await dateTrigger.evaluate(el => getComputedStyle(el).fontSize)), 12.5);
            results.projectFields = await assertVisibleFieldTextAtLeast16(form, 'Project Inquiry');
            await page.screenshot({ path: `${out}/02-project-inquiry-current-mobile.png`, fullPage: false });

            const inquiryClose = inquiry.locator('button[aria-label="Close"]');
            if (await inquiryClose.count()) await inquiryClose.first().click().catch(() => {});

            // Contact form labels.
            await page.goto(base + '/contact/', { waitUntil: 'networkidle', timeout: 60000 });
            await page.waitForTimeout(800);
            const contactForm = page.locator('[data-screen-label="Contact"] form[data-editorial-labels]');
            const contactLabel = contactForm.locator('label > span').first();
            assert.strictEqual(px(await contactLabel.evaluate(el => getComputedStyle(el).fontSize)), 9.25);
            results.contactFields = await assertVisibleFieldTextAtLeast16(contactForm, 'Contact');
            await contactForm.scrollIntoViewIfNeeded();
            await page.screenshot({ path: `${out}/03-contact-current-mobile.png`, fullPage: false });

            // Join form labels and custom placeholder-like listbox trigger.
            await page.goto(base + '/join-our-team/', { waitUntil: 'networkidle', timeout: 60000 });
            await page.waitForTimeout(800);
            const joinForm = page.locator('#program-interest form[data-editorial-labels]');
            const joinLabel = joinForm.locator('label > span').first();
            const joinSelect = joinForm.locator('[aria-haspopup="listbox"]').first();
            assert.strictEqual(px(await joinLabel.evaluate(el => getComputedStyle(el).fontSize)), 9.25);
            assert.strictEqual(px(await joinSelect.evaluate(el => getComputedStyle(el).fontSize)), 12.5);
            results.joinFields = await assertVisibleFieldTextAtLeast16(joinForm, 'Join');
            await joinSelect.scrollIntoViewIfNeeded();
            await page.screenshot({ path: `${out}/04-join-current-mobile.png`, fullPage: false });

            // Sunday School email field.
            await page.goto(base + '/sunday-school/', { waitUntil: 'networkidle', timeout: 60000 });
            await page.waitForTimeout(800);
            const schoolInput = page.locator('#school-notes-email');
            const schoolLabel = page.locator('label[for="school-notes-email"]');
            results.sundaySchool = await paintProbe(page, schoolInput, '04-sunday-school-placeholder');
            assert.strictEqual(px(results.sundaySchool.fieldSize), 16);
            assert.strictEqual(px(await schoolLabel.evaluate(el => getComputedStyle(el).fontSize)), 9.25);
            await schoolInput.scrollIntoViewIfNeeded();
            await page.screenshot({ path: `${out}/05-sunday-school-current-mobile.png`, fullPage: false });

            // Shared footer newsletter field.
            const footer = page.locator('footer');
            const footerInput = footer.locator('[aria-label="Newsletter"] input[placeholder="Email Address"]');
            results.footerNewsletter = await paintProbe(page, footerInput, '05-footer-newsletter-placeholder');
            assert.strictEqual(px(results.footerNewsletter.fieldSize), 16);
            await footerInput.scrollIntoViewIfNeeded();
            await page.screenshot({ path: `${out}/06-footer-newsletter-current-mobile.png`, fullPage: false });

            console.log(JSON.stringify(results, null, 2));
            await browser.close();
          })().catch(err => { console.error(err); process.exit(1); });
          JS
          node /tmp/form-guidance-qa.cjs

      - name: Upload QA screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: form-guidance-microtype-qa
          path: form-guidance-qa
          if-no-files-found: warn

      - name: Commit verified website source only
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/site.css 'Site Header.dc.html' 'Site Footer.dc.html' 'Inquiry Form.dc.html'
          find . -name '*.html' -not -path './.git/*' -not -path './.github/*' -not -path './node_modules/*' -print0 | xargs -0 git add --
          if git diff --cached --quiet; then
            echo "No source changes to commit"
            exit 0
          fi
          git commit -m "[skip netlify] Apply verified form guidance microtype"
          git push
