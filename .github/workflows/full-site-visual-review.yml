name: Full Site Visual Review

on:
  push:
    branches:
      - mobile-typography-faq-hotfix-2026-09-13
    paths:
      - '.github/workflows/full-site-visual-review.yml'

permissions:
  contents: write

jobs:
  review:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout candidate
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply pending form-guidance candidate
        run: python .github/scripts/apply_form_guidance_microtype.py

      - name: Source integrity review
        run: |
          git diff --check
          echo 'Changed website source:'
          git diff --name-only -- . ':!.github'
          if grep -R --include='*.html' --exclude-dir='.git' --exclude-dir='.github' --exclude-dir='node_modules' -n '20260913-15' .; then
            echo 'Old v15 asset reference remains'
            exit 1
          fi
          COUNT=$(grep -R --include='*.html' --exclude-dir='.git' --exclude-dir='.github' --exclude-dir='node_modules' -l '20260913-16' . | wc -l)
          echo "Pages using v16 assets: $COUNT"
          test "$COUNT" -ge 15

      - name: Install WebKit QA dependencies
        run: |
          mkdir -p /tmp/full-review
          npm install --prefix /tmp/full-review playwright@1.55.0 pngjs@7.0.0 >/dev/null 2>&1
          /tmp/full-review/node_modules/.bin/playwright install --with-deps webkit

      - name: Serve candidate
        run: |
          python -m http.server 4173 >/tmp/full-review-http.log 2>&1 &
          echo $! >/tmp/full-review-http.pid
          sleep 2

      - name: Run full rendered review
        run: |
          cat > /tmp/full-review.cjs <<'JS'
          const { webkit } = require('/tmp/full-review/node_modules/playwright');
          const { PNG } = require('/tmp/full-review/node_modules/pngjs');
          const assert = require('node:assert');
          const fs = require('node:fs');

          const base = 'http://127.0.0.1:4173';
          const out = 'full-site-review';
          fs.mkdirSync(out, { recursive: true });

          const routes = [
            ['home','/'],
            ['about','/about/'],
            ['services','/services/'],
            ['our-work','/our-work/'],
            ['luckys','/our-work/luckys-cafe-bakery/'],
            ['pizzeria-coco','/our-work/pizzeria-coco/'],
            ['petti-pathways','/our-work/petti-pathways/'],
            ['folake','/our-work/folake/'],
            ['contact','/contact/'],
            ['join','/join-our-team/'],
            ['sunday-school','/sunday-school/'],
            ['privacy','/privacy-policy/'],
            ['terms','/terms-and-conditions/'],
            ['cookie','/cookie-policy/'],
            ['accessibility','/accessibility/'],
            ['404','/404.html'],
          ];

          const issues = [];
          const pageErrors = [];
          const consoleErrors = [];

          function pixelDiff(aBuf,bBuf){
            const a=PNG.sync.read(aBuf), b=PNG.sync.read(bBuf);
            assert.strictEqual(a.width,b.width);
            assert.strictEqual(a.height,b.height);
            let n=0;
            for(let i=0;i<a.data.length;i+=4){
              if(a.data[i]!==b.data[i]||a.data[i+1]!==b.data[i+1]||a.data[i+2]!==b.data[i+2]||a.data[i+3]!==b.data[i+3]) n++;
            }
            return n;
          }

          async function dismissReservation(page){
            const modal=page.locator('[aria-label="The Sunday Reservation"]');
            if(await modal.count() && await modal.isVisible().catch(()=>false)){
              const close=modal.locator('button[aria-label="Close"]');
              if(await close.count()) await close.first().click().catch(()=>{});
            }
          }

          async function settle(page){
            await page.waitForTimeout(650);
            await dismissReservation(page);
            await page.evaluate(async()=>{
              const max=document.documentElement.scrollHeight;
              for(let y=0;y<max;y+=600){ window.scrollTo(0,y); await new Promise(r=>setTimeout(r,15)); }
              window.scrollTo(0,0);
            });
            await page.waitForTimeout(220);
          }

          async function checkRoute(page,name,route,mode){
            pageErrors.length=0; consoleErrors.length=0;
            await page.goto(base+route,{waitUntil:'networkidle',timeout:60000});
            await settle(page);

            const structural=await page.evaluate(()=>({
              lang:document.documentElement.lang,
              width:document.documentElement.scrollWidth,
              inner:window.innerWidth,
              main:!!document.querySelector('main#main-content'),
              title:document.title,
              images:[...document.images].map(img=>({src:img.currentSrc||img.src,complete:img.complete,naturalWidth:img.naturalWidth,naturalHeight:img.naturalHeight,display:getComputedStyle(img).display,visibility:getComputedStyle(img).visibility,opacity:getComputedStyle(img).opacity})),
              heroes:[...document.querySelectorAll('img[data-sunday-static-hero="true"]')].map(img=>{const r=img.getBoundingClientRect();return {src:img.currentSrc||img.src,naturalWidth:img.naturalWidth,naturalHeight:img.naturalHeight,width:r.width,height:r.height,display:getComputedStyle(img).display,visibility:getComputedStyle(img).visibility,opacity:getComputedStyle(img).opacity};}),
            }));

            if(structural.lang!=='en') issues.push(`${mode} ${route}: html lang is ${structural.lang||'(blank)'}`);
            if(!structural.main) issues.push(`${mode} ${route}: #main-content missing`);
            if(structural.width>structural.inner+3) issues.push(`${mode} ${route}: horizontal overflow ${structural.width}px > ${structural.inner}px`);
            for(const img of structural.images){
              if(!img.complete||img.naturalWidth===0) issues.push(`${mode} ${route}: broken image ${img.src}`);
            }
            for(const hero of structural.heroes){
              if(hero.naturalWidth===0||hero.width<30||hero.height<80||hero.display==='none'||hero.visibility==='hidden'||hero.opacity==='0') issues.push(`${mode} ${route}: hero not visibly rendered ${JSON.stringify(hero)}`);
            }
            if(pageErrors.length) issues.push(`${mode} ${route}: page errors ${pageErrors.join(' | ')}`);
            if(consoleErrors.length) issues.push(`${mode} ${route}: console errors ${consoleErrors.join(' | ')}`);

            await page.screenshot({path:`${out}/${mode}-${name}-full.png`,fullPage:true});
            await page.screenshot({path:`${out}/${mode}-${name}-top.png`,fullPage:false});
            return structural;
          }

          async function provePlaceholder(page,locator,name){
            const token='qa'+name.replace(/[^a-z0-9]/gi,'').toLowerCase();
            await locator.evaluate((el,t)=>el.setAttribute('data-qa-ph',t),token);
            const current=await locator.screenshot();
            const reported=await locator.evaluate(el=>({field:getComputedStyle(el).fontSize,standard:getComputedStyle(el,'::placeholder').fontSize,webkit:getComputedStyle(el,'::-webkit-input-placeholder').fontSize}));
            await page.evaluate(({token})=>{
              const s=document.createElement('style'); s.id='qa-ph-style';
              s.textContent=`[data-qa-ph="${token}"]::placeholder,[data-qa-ph="${token}"]::-webkit-input-placeholder{font-size:12px!important}`;
              document.head.appendChild(s);
            },{token});
            await page.waitForTimeout(80);
            const target=await locator.screenshot();
            await page.locator('#qa-ph-style').evaluate((el,{token})=>{el.textContent=`[data-qa-ph="${token}"]::placeholder,[data-qa-ph="${token}"]::-webkit-input-placeholder{font-size:16px!important}`;},{token});
            await page.waitForTimeout(80);
            const control=await locator.screenshot();
            const dTarget=pixelDiff(current,target), dControl=pixelDiff(current,control), targetControl=pixelDiff(target,control);
            fs.writeFileSync(`${out}/form-${name}-current.png`,current);
            fs.writeFileSync(`${out}/form-${name}-12px-reference.png`,target);
            if(dTarget>4) issues.push(`placeholder ${name}: current does not paint like 12px (${dTarget} pixels differ)`);
            if(dControl<=20||targetControl<=20) issues.push(`placeholder ${name}: not visibly smaller than 16px control`);
            if(parseFloat(reported.field)<16) issues.push(`placeholder ${name}: entered field text below 16px (${reported.field})`);
            await page.locator('#qa-ph-style').evaluate(el=>el.remove());
            await locator.evaluate(el=>el.removeAttribute('data-qa-ph'));
            return {reported,dTarget,dControl,targetControl};
          }

          async function reviewForms(page){
            const result={};
            await page.goto(base+'/',{waitUntil:'networkidle',timeout:60000});
            await page.waitForTimeout(900);
            const reservation=page.locator('[aria-label="The Sunday Reservation"]');
            await reservation.waitFor({state:'visible'});
            result.reservation=await provePlaceholder(page,reservation.locator('input[placeholder="you@example.com"]'),'reservation-email');
            const reservationLabel=parseFloat(await reservation.locator('label[for="reservationEmail"]').evaluate(el=>getComputedStyle(el).fontSize));
            if(reservationLabel>10) issues.push(`Reservation field label is still ${reservationLabel}px`);
            await page.screenshot({path:`${out}/form-reservation-mobile.png`,fullPage:false});
            await dismissReservation(page);

            const start=page.getByText('Start A Project',{exact:true}).first();
            await start.evaluate(el=>el.click());
            const inquiry=page.locator('[aria-label="Project inquiry"]');
            await inquiry.waitFor({state:'visible'});
            const form=inquiry.locator('form[data-inq]');
            await page.screenshot({path:`${out}/form-project-step1-mobile.png`,fullPage:false});
            const labels1=await form.locator('label > span:first-child').evaluateAll(els=>els.filter(el=>getComputedStyle(el).display!=='none').map(el=>({text:el.textContent.trim(),size:parseFloat(getComputedStyle(el).fontSize)})));
            for(const row of labels1){if(row.size>10) issues.push(`Project Inquiry label ${row.text} remains ${row.size}px`);}
            await form.locator('input[name="name"]').fill('QA Test');
            await form.locator('input[name="email"]').fill('qa@example.com');
            await form.locator('input[name="phone"]').fill('2025550123');
            await form.locator('input[name="business"]').fill('QA Studio');
            await form.locator('[data-stepbtns] button').click();
            await page.waitForTimeout(120);
            result.projectWebsite=await provePlaceholder(page,form.locator('input[name="website"]'),'project-website');
            result.projectBudget=await provePlaceholder(page,form.locator('input[name="budget"]'),'project-budget');
            const dateSize=parseFloat(await form.locator('[aria-haspopup="dialog"]').first().evaluate(el=>getComputedStyle(el).fontSize));
            if(dateSize>12.6) issues.push(`Project Inquiry date prompt is ${dateSize}px`);
            await page.screenshot({path:`${out}/form-project-step2-mobile.png`,fullPage:false});
            await form.locator('[data-stepbtns] button').filter({hasText:'Next'}).click();
            await page.waitForTimeout(100);
            await page.screenshot({path:`${out}/form-project-step3-mobile.png`,fullPage:false});
            const close=inquiry.locator('button[aria-label="Close"]'); if(await close.count()) await close.first().click().catch(()=>{});

            await page.goto(base+'/contact/',{waitUntil:'networkidle',timeout:60000}); await page.waitForTimeout(600);
            const contact=page.locator('[data-screen-label="Contact"] form[data-editorial-labels]');
            const contactLabels=await contact.locator('label > span:first-child').evaluateAll(els=>els.map(el=>({text:el.textContent.trim(),size:parseFloat(getComputedStyle(el).fontSize)})));
            for(const row of contactLabels){if(row.size>10) issues.push(`Contact label ${row.text} is ${row.size}px`);}
            await contact.scrollIntoViewIfNeeded(); await page.screenshot({path:`${out}/form-contact-mobile.png`,fullPage:false});

            await page.goto(base+'/join-our-team/',{waitUntil:'networkidle',timeout:60000}); await page.waitForTimeout(600);
            const join=page.locator('#program-interest form[data-editorial-labels]');
            const joinLabels=await join.locator('label > span:first-child').evaluateAll(els=>els.map(el=>({text:el.textContent.trim(),size:parseFloat(getComputedStyle(el).fontSize)})));
            for(const row of joinLabels){if(row.size>10) issues.push(`Join label ${row.text} is ${row.size}px`);}
            const joinPrompt=parseFloat(await join.locator('[aria-haspopup="listbox"]').first().evaluate(el=>getComputedStyle(el).fontSize));
            if(joinPrompt>12.6) issues.push(`Join Select A Program prompt is ${joinPrompt}px`);
            await join.scrollIntoViewIfNeeded(); await page.screenshot({path:`${out}/form-join-mobile.png`,fullPage:false});

            await page.goto(base+'/sunday-school/',{waitUntil:'networkidle',timeout:60000}); await page.waitForTimeout(600);
            result.school=await provePlaceholder(page,page.locator('#school-notes-email'),'sunday-school-email');
            await page.locator('#school-notes-email').scrollIntoViewIfNeeded(); await page.screenshot({path:`${out}/form-sunday-school-mobile.png`,fullPage:false});
            const footerInput=page.locator('footer [aria-label="Newsletter"] input[placeholder="Email Address"]');
            result.footer=await provePlaceholder(page,footerInput,'footer-email');
            await footerInput.scrollIntoViewIfNeeded(); await page.screenshot({path:`${out}/form-footer-mobile.png`,fullPage:false});
            return result;
          }

          async function reviewInteractions(page){
            await page.goto(base+'/',{waitUntil:'networkidle',timeout:60000}); await page.waitForTimeout(650); await dismissReservation(page);
            const menuButton=page.locator('button[aria-label*="menu" i]').first();
            if(await menuButton.count()){
              await menuButton.click().catch(()=>{}); await page.waitForTimeout(100);
              await page.screenshot({path:`${out}/interaction-mobile-menu.png`,fullPage:false});
              await page.keyboard.press('Escape').catch(()=>{});
            }
            const start=page.getByText('Start A Project',{exact:true}).first();
            await start.evaluate(el=>el.click()); await page.waitForTimeout(120);
            const modal=page.locator('[aria-label="Project inquiry"]');
            if(!await modal.isVisible()) issues.push('Project Inquiry did not open from homepage CTA');
            const focused=await page.evaluate(()=>document.activeElement?.outerHTML?.slice(0,180)||'');
            if(!focused) issues.push('No focus target after Project Inquiry opens');
            await page.keyboard.press('Escape'); await page.waitForTimeout(80);
            if(await modal.isVisible().catch(()=>false)) issues.push('Escape did not close Project Inquiry');
          }

          (async()=>{
            const browser=await webkit.launch();
            const summaries={routes:{},forms:{}};

            for(const [mode,viewport] of [['mobile',{width:390,height:844}],['desktop',{width:1440,height:900}]]){
              const context=await browser.newContext({viewport});
              const page=await context.newPage();
              page.on('pageerror',e=>pageErrors.push(e.message));
              page.on('console',m=>{if(m.type()==='error' && !m.text().includes('fonts.googleapis.com')) consoleErrors.push(m.text());});
              summaries.routes[mode]={};
              for(const [name,route] of routes){ summaries.routes[mode][name]=await checkRoute(page,name,route,mode); }
              if(mode==='mobile'){
                summaries.forms=await reviewForms(page);
                await reviewInteractions(page);
              }
              await context.close();
            }

            await browser.close();
            fs.writeFileSync(`${out}/review-summary.json`,JSON.stringify({issues,summaries},null,2));
            console.log('FULL_SITE_REVIEW_SUMMARY');
            console.log(JSON.stringify({issueCount:issues.length,issues,formResults:summaries.forms},null,2));
            if(issues.length) process.exit(1);
          })().catch(err=>{console.error(err);process.exit(1);});
          JS
          node /tmp/full-review.cjs

      - name: Upload all review screenshots and report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: full-site-visual-review
          path: full-site-review
          if-no-files-found: error

      - name: Commit candidate only after complete review passes
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add assets/site.css 'Site Header.dc.html' 'Site Footer.dc.html' 'Inquiry Form.dc.html'
          find . -name '*.html' -not -path './.git/*' -not -path './.github/*' -not -path './node_modules/*' -print0 | xargs -0 git add --
          if git diff --cached --quiet; then
            echo 'No website source changes to commit'
            exit 0
          fi
          git commit -m '[skip netlify] Apply fully reviewed form guidance sizing'
          git push
