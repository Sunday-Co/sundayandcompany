name: Cleanup Sunday Correction Audit

on:
  push:
    branches:
      - full-correction-audit-2026-09-11
    paths:
      - '.github/workflows/cleanup-correction-audit.yml'

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - name: Check out correction branch
        uses: actions/checkout@v4
        with:
          ref: full-correction-audit-2026-09-11
          fetch-depth: 0

      - name: Remove temporary correction and QA files
        run: |
          rm -f \
            .github/workflows/apply-batch-1-final.yml \
            .github/workflows/apply-batch-2-3.yml \
            .github/workflows/apply-batch-8-9.yml \
            .github/workflows/apply-program-card-webkit.yml \
            .github/workflows/final-source-validate.yml \
            .github/workflows/form-state-qa.yml \
            .github/workflows/webkit-qa.yml \
            CORRECTION_CHECKLIST.md \
            QA_SOURCE_REPORT.md \
            qa/TRIGGER.txt \
            qa/form-state-qa.mjs \
            qa/webkit-qa.mjs \
            scripts/apply-batch-1-final.py \
            scripts/apply-batch-2-3.py \
            scripts/apply-batch-8-9.py \
            scripts/apply-program-card-webkit.py
          rm -f .github/workflows/cleanup-correction-audit.yml
          rmdir qa 2>/dev/null || true
          rmdir scripts 2>/dev/null || true

      - name: Commit clean production branch
        run: |
          git config user.name "Sunday & Company Corrections"
          git config user.email "hello@sundayandcompany.co"
          git add -A
          if git diff --cached --quiet; then
            echo "Nothing to clean."
            exit 0
          fi
          git commit -m "Clean temporary correction QA files"
          git push origin HEAD:full-correction-audit-2026-09-11
