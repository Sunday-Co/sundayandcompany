name: Rendered Corrections QA

# Final run against the fully corrected production source.
on:
  push:
    branches:
      - rendered-corrections-2026-09-12

permissions:
  contents: read

jobs:
  webkit-rendered:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout correction branch
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Playwright WebKit
        run: |
          npm init -y
          npm install --no-save playwright@1.55.0
          npx playwright install --with-deps webkit

      - name: Patch temporary QA harness variable scope
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('qa/final-rendered-qa.mjs')
          s = p.read_text()
          old = "return {heroAnimations,visionAnimations:document.querySelector('#vision')?.getAnimations({subtree:true}).length||0,quoteWeight:quote?getComputedStyle(quote).fontWeight:null,bodySizes:bodies.map(size),fine:size(fine),newsInput:size(nInput),newsButton:size(nBtn),footer};"
          new = "return {visionAnimations:document.querySelector('#vision')?.getAnimations({subtree:true}).length||0,quoteWeight:quote?getComputedStyle(quote).fontWeight:null,bodySizes:bodies.map(size),fine:size(fine),newsInput:size(nInput),newsButton:size(nBtn),footer};"
          if old not in s:
              raise SystemExit('QA scope patch target not found')
          s = s.replace(old, new, 1)
          old2 = "report.specific.home=v;"
          new2 = "v.heroAnimations=heroAnimations;\n    report.specific.home=v;"
          if old2 not in s:
              raise SystemExit('QA result patch target not found')
          p.write_text(s.replace(old2, new2, 1))
          PY

      - name: Start static server
        run: |
          python3 -m http.server 4173 >/tmp/sunday-final-server.log 2>&1 &
          echo $! > /tmp/sunday-final-server.pid
          sleep 3
          curl --fail http://127.0.0.1:4173/ >/dev/null

      - name: Run final rendered hierarchy, motion and Safari QA
        run: node qa/final-rendered-qa.mjs

      - name: Upload final rendered screenshots and report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: final-rendered-qa
          path: qa-final-artifacts
          retention-days: 5
