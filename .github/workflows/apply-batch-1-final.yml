name: Apply Sunday Batch 1 Final

on:
  push:
    branches:
      - full-correction-audit-2026-09-11
    paths:
      - scripts/apply-batch-1-final.py
      - .github/workflows/apply-batch-1-final.yml

permissions:
  contents: write

jobs:
  apply-and-validate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: full-correction-audit-2026-09-11
          fetch-depth: 0

      - name: Apply functional microtype audit
        run: python3 scripts/apply-batch-1-final.py

      - name: Validate source
        run: |
          set -e
          git diff --check
          python3 - <<'PY'
          from pathlib import Path
          css = Path('assets/site.css').read_text(encoding='utf-8')
          assert 'BATCH 1 FINAL: FUNCTIONAL MICROTYPE AUDIT' in css
          assert 'header nav[aria-label="Primary navigation"]' in css
          assert '[data-program-cards] [data-program-action]' in css
          cards = Path('Program Cards.dc.html').read_text(encoding='utf-8')
          assert cards.count('data-program-action') == 9
          assert 'data-program-cards' in cards
          root = cards
          for p in Path('.').rglob('Program Cards.dc.html'):
              assert p.read_text(encoding='utf-8') == root, p
          report = Path('QA_SOURCE_REPORT.md').read_text(encoding='utf-8')
          assert 'Small-type classification decision' in report
          check = Path('CORRECTION_CHECKLIST.md').read_text(encoding='utf-8')
          assert 'Audit remaining sub-11px text and classify it' in check
          print('Batch 1 final validation passed.')
          PY

      - name: Commit functional microtype audit
        run: |
          git config user.name "Sunday & Company Corrections"
          git config user.email "hello@sundayandcompany.co"
          git add -A
          if git diff --cached --quiet; then
            echo "No Batch 1 final changes needed."
          else
            git commit -m "Batch 1: finish functional microtype audit"
            git push origin HEAD:full-correction-audit-2026-09-11
          fi
