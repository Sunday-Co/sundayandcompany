name: Apply Sunday Clean Production

on:
  push:
    branches:
      - sunday-clean-production
    paths:
      - scripts/cleanup_site.py
      - .github/workflows/apply-cleanup.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - name: Check out cleanup branch
        uses: actions/checkout@v4
        with:
          ref: sunday-clean-production
          fetch-depth: 0

      - name: Apply deterministic source cleanup
        run: python3 scripts/cleanup_site.py

      - name: Validate diff
        run: |
          git diff --check
          python3 - <<'PY'
          from pathlib import Path
          import tomllib
          with open('netlify.toml','rb') as f:
              data = tomllib.load(f)
          assert data['build']['publish'] == '.', data['build']
          assert Path('assets/site.css').exists()
          assert Path('assets/site.js').exists()
          print('Netlify config and shared assets validated.')
          PY

      - name: Commit cleaned production source
        run: |
          git config user.name "Sunday & Company Cleanup"
          git config user.email "hello@sundayandcompany.co"
          git add -A
          if git diff --cached --quiet; then
            echo "No source changes required."
          else
            git commit -m "Apply clean production source updates"
            git push origin HEAD:sunday-clean-production
          fi
