name: Form Guidance Paint Proof

on:
  push:
    branches:
      - mobile-typography-faq-hotfix-2026-09-13
    paths:
      - '.github/workflows/form-guidance-paint-proof.yml'

permissions:
  contents: write

jobs:
  prove-and-commit:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply candidate form guidance source changes
        run: python .github/scripts/apply_form_guidance_microtype.py

      - name: Validate source before browser QA
        run: |
          git diff --check
          if grep -R --include='*.html' --exclude-dir='.git' --exclude-dir='.github' --exclude-dir='node_modules' -n '20260913-15' .; then
            echo 'Old v15 asset reference remains'
            exit 1
          fi

      - name: Install WebKit and PNG comparison tooling outside repo
        run: |
          mkdir -p /tmp/form-proof
          npm install --prefix /tmp/form-proof playwright@1.55.0 pngjs@7.0.0 >/dev/null 2>&1
          /tmp/form-proof/node_modules/.bin/playwright install --with-deps webkit

      - name: Serve candidate
        run: |
          python -m http.server 4173 >/tmp/form-proof-http.log 2>&1 &
          sleep 2

      - name: Prove rendered mobile guidance sizes
        run: |
          cat > /tmp/form-proof.cjs <<'JS'
          const { webkit } = require('/tmp/form-proof/node_modules/playwright');
          const { PNG } = require('/tmp/form-proof/node_modules/pngjs');
          const assert = require('node:assert');
          const fs = require('node:fs');

          const base = 'http://127.0.0.1:4173';
          const out = 'form-guidance-paint-proof';
          fs.mkdirSync(out, { recursive: true });
          const px = v => parseFloat(v || '0');

          function diff(aBuf, bBuf) {
            const a = PNG.sync.read(aBuf);
            const b = PNG.sync.read(bBuf);
            assert.strictEqual(a.width, b.width);
            assert.strictEqual(a.height, b.height);
            let n = 0;
            for (let i = 0; i < a.data.length; i += 4) {
              if (a.data[i] !== b.data[i] || a.data[i+1] !== b.data[i+1] || a.data[i+2] !== b.data[i+2] || a.data[i+3] !== b.data[i+3]) n++;
            }
            return n;
          }

          async function forceSize(page, token, selector, size) {
            await page.evaluate(({ token, selector, size }) => {
              let s = document.getElementById('qa-force-size');
              if (!s) {
                s = document.createElement('style');
                s.id = 'qa-force-size';
                document.head.appendChild(s);
              }
              s.textContent = `[data-qa-size="${token}"]${selector}{font-size:${size}px !important;}`;
            }, { token, selector, size });
            await page.waitForTimeout(70);
          }

          async function placeholderPaint(page, locator, name, target=12) {
            const token = 'p' + name.replace(/[^a-z0-9]/gi, '').toLowerCase();
            await locator.evaluate((el,t) => el.setAttribute('data-qa-size',t), token);
            const current = await locator.screenshot();
            await forceSize(page, token, '::placeholder', target);
            let s = await page.locator('#qa-force-size').evaluate(el => el.textContent);
            await page.locator('#qa-force-size').evaluate((el,{token,target}) => {
              el.textContent += `[data-qa-size="${token}"]::-webkit-input-placeholder{font-size:${target}px !important;}`;
            }, { token, target });
            await page.waitForTimeout(70);
            const forcedTarget = await locator.screenshot();
            await page.locator('#qa-force-size').evaluate((el,{token}) => {
              el.textContent = `[data-qa-size="${token}"]::placeholder,[data-qa-size="${token}"]::-webkit-input-placeholder{font-size:16px !important;}`;
            }, { token });
            await page.waitForTimeout(70);
            const forced16 = await locator.screenshot();
            const result = { currentVsTarget: diff(current, forcedTarget), currentVs16: diff(current, forced16), targetVs16: diff(forcedTarget, forced16), field: await locator.evaluate(el => getComputedStyle(el).fontSize) };
            fs.writeFileSync(`${out}/${name}-current.png`, current);
            fs.writeFileSync(`${out}/${name}-target-${target}.png`, forcedTarget);
            assert.ok(result.currentVsTarget <= 4, `${name} does not paint like ${target}px: ${JSON.stringify(result)}`);
            assert.ok(result.currentVs16 > 20 && result.targetVs16 > 20, `${name} is not visually smaller than 16px: ${JSON.stringify(result)}`);
            assert.ok(px(result.field) >= 16, `${name} entered text dropped below 16px: ${result.field}`);
            await page.locator('#qa-force-size').evaluate(el => el.remove());
            await locator.evaluate(el => el.removeAttribute('data-qa-size'));
            return result;
          }

          async function textPaint(page, locator, name, target, control) {
            const token = 't' + name.replace(/[^a-z0-9]/gi, '').toLowerCase();
            await locator.evaluate((el,t) => el.setAttribute('data-qa-size',t), token);
            const current = await locator.screenshot();
            await forceSize(page, token, '', target);
            const forcedTarget = await locator.screenshot();
            await forceSize(page, token, '', control);
            const forcedControl = await locator.screenshot();
            const result = { currentVsTarget: diff(current, forcedTarget), currentVsControl: diff(current, forcedControl), targetVsControl: diff(forcedTarget, forcedControl), reported: await locator.evaluate(el => getComputedStyle(el).fontSize) };
            fs.writeFileSync(`${out}/${name}-current.png`, current);
            assert.ok(result.currentVsTarget <= 4, `${name} does not paint like ${target}px: ${JSON.stringify(result)}`);
            assert.ok(result.currentVsControl > 10 && result.targetVsControl > 10, `${name} is not visually distinct from ${control}px: ${JSON.stringify(result)}`);
            await page.locator('#qa-force-size').evaluate(el => el.remove());
            await locator.evaluate(el => el.removeAttribute('data-qa-size'));
            return result;
          }

          async function closeReservation(page) {
            const b = page.locator('[aria-label="The Sunday Reservation"] button[aria-label="Close"]');
            if (await b.count() && await b.first().isVisible().catch(() => false)) await b.first().click();
          }

          (async () => {
            const browser = await webkit.launch();
            const page = await browser.newPage({ viewport: { width: 390, height: 844 } });
            const results = {};

            // Reservation popup.
            await page.goto(base + '/', { waitUntil:'networkidle', timeout:60000 });
            await page.waitForTimeout(900);
            const reservation = page.locator('[aria-label="The Sunday Reservation"]');
            await reservation.waitFor({ state:'visible' });
            results.reservationPlaceholder = await placeholderPaint(page, reservation.locator('input[placeholder="you@example.com"]'), '01-reservation-placeholder');
            results.reservationLabel = await textPaint(page, reservation.locator('label[for="reservationEmail"]'), '02-reservation-label', 9.5, 14);
            await page.screenshot({ path:`${out}/01-reservation-mobile.png`, fullPage:false });
            await closeReservation(page);

            // Project Inquiry, step 1 and step 2.
            await page.getByText('Start A Project', { exact:true }).first().evaluate(el => el.click());
            const inquiry = page.locator('[aria-label="Project inquiry"]');
            await inquiry.waitFor({ state:'visible' });
            const form = inquiry.locator('form[data-inq]');
            results.projectLabel = await textPaint(page, form.locator('label > span').first(), '03-project-label', 9.5, 14);
            await form.locator('input[name="name"]').fill('QA Test');
            await form.locator('input[name="email"]').fill('qa@example.com');
            await form.locator('input[name="phone"]').fill('2025550123');
            await form.locator('input[name="business"]').fill('QA Studio');
            await form.locator('[data-stepbtns] button').click();
            await page.waitForTimeout(140);
            results.projectWebsite = await placeholderPaint(page, form.locator('input[name="website"]'), '04-project-website-placeholder');
            results.projectBudget = await placeholderPaint(page, form.locator('input[name="budget"]'), '05-project-budget-placeholder');
            results.projectWebsiteLabel = await textPaint(page, form.locator('input[name="website"]').locator('xpath=ancestor::label[1]/span[1]'), '06-project-website-label', 9.5, 14);
            results.projectDatePrompt = await textPaint(page, form.locator('[aria-haspopup="dialog"]').first(), '07-project-date-prompt', 12.5, 16);
            await page.screenshot({ path:`${out}/02-project-inquiry-mobile.png`, fullPage:false });
            const inquiryClose = inquiry.locator('button[aria-label="Close"]');
            if (await inquiryClose.count()) await inquiryClose.first().click().catch(()=>{});

            // Contact labels and entered text.
            await page.goto(base + '/contact/', { waitUntil:'networkidle', timeout:60000 });
            await page.waitForTimeout(700);
            const contactForm = page.locator('[data-screen-label="Contact"] form[data-editorial-labels]');
            results.contactLabel = await textPaint(page, contactForm.locator('label > span').first(), '08-contact-label', 9.5, 14);
            const contactInputSize = px(await contactForm.locator('input[name="name"]').evaluate(el => getComputedStyle(el).fontSize));
            assert.ok(contactInputSize >= 16, `Contact entered text is ${contactInputSize}px`);
            await contactForm.scrollIntoViewIfNeeded();
            await page.screenshot({ path:`${out}/03-contact-mobile.png`, fullPage:false });

            // Join labels and custom program prompt.
            await page.goto(base + '/join-our-team/', { waitUntil:'networkidle', timeout:60000 });
            await page.waitForTimeout(700);
            const joinForm = page.locator('#program-interest form[data-editorial-labels]');
            results.joinLabel = await textPaint(page, joinForm.locator('label > span').first(), '09-join-label', 9.5, 14);
            results.joinPrompt = await textPaint(page, joinForm.locator('[aria-haspopup="listbox"]').first(), '10-join-program-prompt', 12.5, 16);
            const joinInputSize = px(await joinForm.locator('input[name="interestName"]').evaluate(el => getComputedStyle(el).fontSize));
            assert.ok(joinInputSize >= 16, `Join entered text is ${joinInputSize}px`);
            await joinForm.scrollIntoViewIfNeeded();
            await page.screenshot({ path:`${out}/04-join-mobile.png`, fullPage:false });

            // Sunday School email placeholder. Its existing label is intentionally already smaller.
            await page.goto(base + '/sunday-school/', { waitUntil:'networkidle', timeout:60000 });
            await page.waitForTimeout(700);
            results.schoolPlaceholder = await placeholderPaint(page, page.locator('#school-notes-email'), '11-sunday-school-placeholder');
            await page.locator('#school-notes-email').scrollIntoViewIfNeeded();
            await page.screenshot({ path:`${out}/05-sunday-school-mobile.png`, fullPage:false });

            // Shared footer newsletter placeholder.
            const footerInput = page.locator('footer [aria-label="Newsletter"] input[placeholder="Email Address"]');
            results.footerPlaceholder = await placeholderPaint(page, footerInput, '12-footer-placeholder');
            await footerInput.scrollIntoViewIfNeeded();
            await page.screenshot({ path:`${out}/06-footer-mobile.png`, fullPage:false });

            console.log('FORM_GUIDANCE_PAINT_PROOF');
            console.log(JSON.stringify(results, null, 2));
            await browser.close();
          })().catch(err => { console.error(err); process.exit(1); });
          JS
          node /tmp/form-proof.cjs

      - name: Upload rendered proof
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: form-guidance-paint-proof
          path: form-guidance-paint-proof
          if-no-files-found: warn

      - name: Commit only verified website source
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/site.css 'Site Header.dc.html' 'Site Footer.dc.html' 'Inquiry Form.dc.html'
          find . -name '*.html' -not -path './.git/*' -not -path './.github/*' -not -path './node_modules/*' -print0 | xargs -0 git add --
          if git diff --cached --quiet; then
            echo 'No website source changes to commit'
            exit 0
          fi
          git commit -m '[skip netlify] Apply rendered form guidance sizing'
          git push
