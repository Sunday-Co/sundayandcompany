name: Apply Sunday Batch 2-3

on:
  push:
    branches:
      - full-correction-audit-2026-09-11
    paths:
      - scripts/apply-batch-2-3.py
      - .github/workflows/apply-batch-2-3.yml

permissions:
  contents: write

jobs:
  apply-and-validate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Check out audit branch
        uses: actions/checkout@v4
        with:
          ref: full-correction-audit-2026-09-11
          fetch-depth: 0

      - name: Apply Batch 2-3 source corrections
        run: python3 scripts/apply-batch-2-3.py

      - name: Validate corrections
        run: |
          set -e
          git diff --check
          node --check assets/site.js
          python3 - <<'PY'
          from pathlib import Path
          import tomllib

          with open('netlify.toml','rb') as f:
              cfg = tomllib.load(f)
          assert cfg['build']['publish'] == '.'
          assert 'command' not in cfg['build']

          css = Path('assets/site.css').read_text(encoding='utf-8')
          assert 'form[data-editorial-labels] > div > span:first-child' in css
          assert 'form[data-editorial-labels] [aria-haspopup="listbox"]' in css
          assert '[data-receipt-meta]' in css
          assert 'font-size: 8px !important;' in css

          inquiry = Path('Inquiry Form.dc.html').read_text(encoding='utf-8')
          for phrase in ['01&nbsp; Project Basics','02&nbsp; Timing &amp; Budget','03&nbsp; Project Scope']:
              assert phrase in inquiry
          assert 'step1TabBg' in inquiry and 'step3TabFg' in inquiry

          cards = Path('Program Cards.dc.html').read_text(encoding='utf-8')
          assert "dialogPosition: t ? 'static' : 'fixed'" in cards
          assert "dialogInnerOverflow: t ? 'visible' : 'auto'" in cards
          assert "dialogMaxHeight: t ? 'none'" in cards
          assert "dialogAria: t ? 'false' : 'true'" in cards

          assert 'data-news-fineprint' in Path('Site Footer.dc.html').read_text(encoding='utf-8')
          assert 'data-receipt-meta' in Path('contact/index.html').read_text(encoding='utf-8')
          assert 'data-receipt-meta' in Path('join-our-team/index.html').read_text(encoding='utf-8')
          assert 'data-receipt-meta' in Path('sunday-school/index.html').read_text(encoding='utf-8')

          # Shared component copies must be identical to root.
          for name in ['Inquiry Form.dc.html','Program Cards.dc.html','Site Header.dc.html','Site Footer.dc.html']:
              root = Path(name).read_text(encoding='utf-8')
              for p in Path('.').rglob(name):
                  assert p.read_text(encoding='utf-8') == root, p

          # Vision Title Case must remain untouched.
          home = Path('index.html').read_text(encoding='utf-8')
          assert 'Marketing Should Feel Less Like Noise And More Like An Invitation.' in home

          print('Batch 2-3 validation passed.')
          PY

      - name: Commit Batch 2-3
        run: |
          git config user.name "Sunday & Company Corrections"
          git config user.email "hello@sundayandcompany.co"
          git add -A
          if git diff --cached --quiet; then
            echo "No Batch 2-3 changes needed."
          else
            git commit -m "Batch 2-3: audit forms and receipt behavior"
            git push origin HEAD:full-correction-audit-2026-09-11
          fi
