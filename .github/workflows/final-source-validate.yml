name: Final Sunday Source Validation

on:
  push:
    branches:
      - full-correction-audit-2026-09-11
    paths:
      - '.github/workflows/final-source-validate.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out audit branch
        uses: actions/checkout@v4
        with:
          ref: full-correction-audit-2026-09-11
          fetch-depth: 0

      - name: Fetch main
        run: git fetch origin main --depth=1

      - name: Diff whitespace check
        run: git diff --check origin/main...HEAD

      - name: Validate Netlify TOML
        run: |
          python3 - <<'PY'
          import tomllib
          with open('netlify.toml','rb') as f:
              cfg = tomllib.load(f)
          assert cfg.get('build',{}).get('publish') == '.', cfg
          print('netlify.toml OK')
          PY

      - name: Validate production JavaScript syntax
        run: |
          node --check assets/site.js
          node --check web3forms.js

      - name: Validate page inventory and social preview
        run: |
          python3 - <<'PY'
          from pathlib import Path
          pages = [
              Path('index.html'), Path('about/index.html'), Path('services/index.html'),
              Path('our-work/index.html'), Path('our-work/pizzeria-coco/index.html'),
              Path('our-work/petti-pathways/index.html'), Path('our-work/luckys-cafe-bakery/index.html'),
              Path('our-work/folake/index.html'), Path('contact/index.html'),
              Path('join-our-team/index.html'), Path('sunday-school/index.html'),
              Path('privacy-policy/index.html'), Path('terms-and-conditions/index.html'),
              Path('cookie-policy/index.html'), Path('accessibility/index.html'), Path('404.html')
          ]
          missing=[]
          for p in pages:
              text=p.read_text(encoding='utf-8')
              if 'https://sundayandcompany.co/social-preview.png' not in text:
                  missing.append(str(p))
          assert not missing, f'Missing social preview: {missing}'
          print(f'{len(pages)} page social previews OK')
          PY

      - name: Validate shared components stay synchronized
        run: |
          python3 - <<'PY'
          from pathlib import Path
          roots=['Site Header.dc.html','Site Footer.dc.html','Inquiry Form.dc.html','Program Cards.dc.html']
          dirs=['about','accessibility','contact','cookie-policy','join-our-team','our-work','our-work/folake','our-work/luckys-cafe-bakery','our-work/petti-pathways','our-work/pizzeria-coco','privacy-policy','services','sunday-school','terms-and-conditions']
          mismatches=[]
          for root in roots:
              base=Path(root).read_bytes()
              for d in dirs:
                  p=Path(d)/root
                  if p.exists() and p.read_bytes()!=base:
                      mismatches.append(str(p))
          assert not mismatches, 'Shared component copies differ: ' + ', '.join(mismatches)
          print('shared component copies OK')
          PY

      - name: Validate named inquiry steps
        run: |
          python3 - <<'PY'
          from pathlib import Path
          expected=['01&nbsp; Project Basics','02&nbsp; Timing &amp; Budget','03&nbsp; Project Scope']
          for p in [Path('Inquiry Form.dc.html'), Path('services/Inquiry Form.dc.html')]:
              text=p.read_text(encoding='utf-8')
              for item in expected:
                  assert item in text, f'{p}: missing {item}'
          print('inquiry steps OK')
          PY

      - name: Validate no abandoned nested update source
        run: |
          test ! -d Sunday-Co-Ysabeau-Mobile-Forms-Update
          echo 'repository root is the production source of truth'
