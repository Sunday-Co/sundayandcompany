name: Targeted WebKit QA

on:
  push:
    branches:
      - final-polish-no-deploy-2026-09-12

permissions:
  contents: write

jobs:
  qa:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Apply final source fixes
        run: |
          python .github/scripts/revert_inquiry_lockup.py
          python .github/scripts/fix_open_sign.py
          python .github/scripts/fix_program_cards.py
      - name: Validate source before browser QA
        run: |
          node --check assets/site.js
          git diff --check
          grep -q 'data-sign] p\[aria-hidden\].*Pinyon Script' assets/rendered-corrections.css
          grep -q 'sc-neon-sunday-final 8.4s' assets/rendered-corrections.css
          grep -q 'sc-sway 12s' assets/rendered-corrections.css
          grep -q 'max-width:520px' assets/rendered-corrections.css
          grep -q 'frontVisibility0' 'Program Cards.dc.html'
          grep -q 'backVisibility2' 'Program Cards.dc.html'
          grep -q 'duration: 1300' assets/site.js
          grep -q 'duration: 1450' assets/site.js
      - name: Install WebKit
        run: |
          npm install --no-save playwright@1.55.0
          npx playwright install --with-deps webkit
      - name: Serve site
        run: |
          python3 -m http.server 4173 > /tmp/sunday-http.log 2>&1 &
          echo $! > /tmp/sunday-http.pid
          sleep 2
      - name: Run final WebKit QA
        run: node .github/scripts/targeted_qa.mjs
      - name: Upload screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sunday-targeted-qa-final
          path: /tmp/sunday-qa
          if-no-files-found: ignore
      - name: Commit verified source and remove temporary QA tooling
        if: success()
        run: |
          git config user.name "Sunday-Co"
          git config user.email "hello@sundayandcompany.co"
          git rm .github/workflows/targeted-webkit-qa.yml .github/scripts/targeted_qa.mjs .github/scripts/revert_inquiry_lockup.py .github/scripts/fix_open_sign.py .github/scripts/fix_program_cards.py
          git add -A
          git diff --cached --check
          git commit -m "[skip ci] [skip netlify] Verify final Sunday visual batch"
          git push origin HEAD:${GITHUB_REF_NAME}
