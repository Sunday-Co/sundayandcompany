name: Controlled UI Visual Fix

on:
  push:
    branches:
      - controlled-ui-audit-no-deploy-2026-09-13
    paths:
      - .github/workflows/controlled-ui-visual-fix.yml
  workflow_dispatch:

permissions:
  contents: write

# visual-fix-v3
jobs:
  fix:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Apply controlled corrections
        run: python3 .github/scripts/controlled_ui_visual_fix.py
      - name: Commit source correction
        run: |
          git config user.name Sunday-Co
          git config user.email hello@sundayandcompany.co
          git add assets/site.css
          git diff --cached --check
          git commit -m "[skip netlify] Fix modal visibility and reservation readability"
          git push
