name: Full Page Safari QA

on:
  push:
    branches:
      - full-correction-audit-2026-09-11

permissions:
  contents: read

jobs:
  webkit-fullpage:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout correction branch
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Playwright WebKit
        run: |
          npm init -y
          npm install --no-save playwright@1.55.0
          npx playwright install --with-deps webkit

      - name: Start static server
        run: |
          python3 -m http.server 4173 >/tmp/sunday-server.log 2>&1 &
          echo $! > /tmp/sunday-server.pid
          sleep 3
          curl --fail http://127.0.0.1:4173/ >/dev/null

      - name: Run all-route Safari-style full-page QA
        run: node qa/fullpage-safari-qa.mjs

      - name: Upload screenshots and report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: fullpage-safari-qa
          path: qa-artifacts
          retention-days: 5
