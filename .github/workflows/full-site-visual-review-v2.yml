name: Full Site Visual Review V2

on:
  push:
    branches:
      - mobile-typography-faq-hotfix-2026-09-13
    paths:
      - '.github/workflows/full-site-visual-review-v2.yml'

permissions:
  contents: write

jobs:
  review:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout candidate
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply pending form-guidance candidate
        run: python .github/scripts/apply_form_guidance_microtype.py

      - name: Source integrity review
        run: |
          git diff --check
          if grep -R --include='*.html' --exclude-dir='.git' --exclude-dir='.github' --exclude-dir='node_modules' -n '20260913-15' .; then
            echo 'Old v15 asset reference remains'
            exit 1
          fi
          COUNT=$(grep -R --include='*.html' --exclude-dir='.git' --exclude-dir='.github' --exclude-dir='node_modules' -l '20260913-16' . | wc -l)
          echo "Pages using v16 assets: $COUNT"
          test "$COUNT" -ge 15

      - name: Install WebKit QA dependencies
        run: |
          mkdir -p /tmp/full-review-v2
          npm install --prefix /tmp/full-review-v2 playwright@1.55.0 pngjs@7.0.0 >/dev/null 2>&1
          /tmp/full-review-v2/node_modules/.bin/playwright install --with-deps webkit

      - name: Serve candidate
        run: |
          python -m http.server 4173 >/tmp/full-review-v2-http.log 2>&1 &
          sleep 2

      - name: Run full rendered review
        run: |
          cat > /tmp/full-review-v2.cjs <<'JS'
          const { webkit } = require('/tmp/full-review-v2/node_modules/playwright');
          const { PNG } = require('/tmp/full-review-v2/node_modules/pngjs');
          const fs = require('node:fs');
          const assert = require('node:assert');

          const base='http://127.0.0.1:4173';
          const out='full-site-review-v2';
          fs.mkdirSync(out,{recursive:true});
          const issues=[];
          const report={routes:{},forms:{},interactions:{},issues};
          const routes=[
            ['home','/'],['about','/about/'],['services','/services/'],['our-work','/our-work/'],
            ['luckys','/our-work/luckys-cafe-bakery/'],['pizzeria-coco','/our-work/pizzeria-coco/'],
            ['petti-pathways','/our-work/petti-pathways/'],['folake','/our-work/folake/'],
            ['contact','/contact/'],['join','/join-our-team/'],['sunday-school','/sunday-school/'],
            ['privacy','/privacy-policy/'],['terms','/terms-and-conditions/'],['cookie','/cookie-policy/'],
            ['accessibility','/accessibility/'],['404','/404.html']
          ];
          const px=v=>parseFloat(v||'0');

          function pngDiff(aBuf,bBuf){
            const a=PNG.sync.read(aBuf),b=PNG.sync.read(bBuf);
            assert.strictEqual(a.width,b.width); assert.strictEqual(a.height,b.height);
            let n=0; for(let i=0;i<a.data.length;i+=4){if(a.data[i]!==b.data[i]||a.data[i+1]!==b.data[i+1]||a.data[i+2]!==b.data[i+2]||a.data[i+3]!==b.data[i+3])n++;}
            return n;
          }

          async function dismissReservation(page){
            const modal=page.locator('[aria-label="The Sunday Reservation"]');
            if(await modal.count() && await modal.isVisible().catch(()=>false)){
              const close=modal.locator('button[aria-label="Close"]');
              if(await close.count()) await close.first().click().catch(()=>{});
            }
          }

          async function settle(page){
            await page.waitForTimeout(500);
            await dismissReservation(page);
            await page.evaluate(async()=>{
              const max=document.documentElement.scrollHeight;
              for(let y=0;y<max;y+=650){window.scrollTo(0,y);await new Promise(r=>setTimeout(r,12));}
              window.scrollTo(0,0);
            });
            await page.waitForTimeout(180);
          }

          async function reviewRoute(context,mode,name,route){
            const page=await context.newPage();
            const pageErrors=[],consoleErrors=[];
            page.on('pageerror',e=>pageErrors.push(e.message));
            page.on('console',m=>{if(m.type()==='error'&&!m.text().includes('fonts.googleapis.com'))consoleErrors.push(m.text());});
            await page.goto(base+route,{waitUntil:'networkidle',timeout:60000});
            await settle(page);
            const state=await page.evaluate(()=>({
              lang:document.documentElement.lang,
              scrollWidth:document.documentElement.scrollWidth,
              innerWidth:innerWidth,
              bodyScrollWidth:document.body.scrollWidth,
              main:!!document.querySelector('main#main-content'),
              images:[...document.images].map(img=>({src:img.currentSrc||img.src,complete:img.complete,nw:img.naturalWidth,nh:img.naturalHeight})),
              heroes:[...document.querySelectorAll('img[data-sunday-static-hero="true"]')].map(img=>{const r=img.getBoundingClientRect(),s=getComputedStyle(img);return{src:img.currentSrc||img.src,nw:img.naturalWidth,nh:img.naturalHeight,w:r.width,h:r.height,display:s.display,visibility:s.visibility,opacity:s.opacity};}),
              overflowers:[...document.querySelectorAll('body *')].map(el=>{const r=el.getBoundingClientRect();return{tag:el.tagName,id:el.id,cls:el.className?.toString?.().slice(0,100)||'',left:r.left,right:r.right,width:r.width,text:(el.textContent||'').trim().replace(/\s+/g,' ').slice(0,80)}}).filter(x=>x.right>innerWidth+3||x.left<-3).sort((a,b)=>b.right-a.right).slice(0,15)
            }));
            report.routes[mode]??={}; report.routes[mode][name]={route,state,pageErrors,consoleErrors};
            if(state.lang!=='en')issues.push(`${mode} ${route}: html lang=${state.lang||'(blank)'}`);
            if(!state.main)issues.push(`${mode} ${route}: main#main-content missing`);
            if(state.scrollWidth>state.innerWidth+3)issues.push(`${mode} ${route}: horizontal overflow ${state.scrollWidth}px vs ${state.innerWidth}px; top offenders=${JSON.stringify(state.overflowers.slice(0,5))}`);
            for(const img of state.images){if(!img.complete||img.nw===0)issues.push(`${mode} ${route}: broken image ${img.src}`);}
            for(const hero of state.heroes){if(hero.nw===0||hero.w<30||hero.h<80||hero.display==='none'||hero.visibility==='hidden'||hero.opacity==='0')issues.push(`${mode} ${route}: hero render failure ${JSON.stringify(hero)}`);}
            if(pageErrors.length)issues.push(`${mode} ${route}: page errors ${pageErrors.join(' | ')}`);
            if(consoleErrors.length)issues.push(`${mode} ${route}: console errors ${consoleErrors.join(' | ')}`);
            await page.screenshot({path:`${out}/${mode}-${name}-top.png`,fullPage:false});
            await page.screenshot({path:`${out}/${mode}-${name}-full.png`,fullPage:true});
            await page.close();
          }

          async function placeholderProof(page,locator,name){
            const token='qa'+name.replace(/[^a-z0-9]/gi,'').toLowerCase();
            await locator.evaluate((el,t)=>el.setAttribute('data-qa-ph',t),token);
            const current=await locator.screenshot();
            const metrics=await locator.evaluate(el=>({field:getComputedStyle(el).fontSize,standard:getComputedStyle(el,'::placeholder').fontSize,webkit:getComputedStyle(el,'::-webkit-input-placeholder').fontSize}));
            const style=await page.evaluateHandle(({token})=>{const s=document.createElement('style');s.id='qa-ph';s.textContent=`[data-qa-ph="${token}"]::placeholder,[data-qa-ph="${token}"]::-webkit-input-placeholder{font-size:12px!important}`;document.head.appendChild(s);return s;},{token});
            await page.waitForTimeout(70); const ref12=await locator.screenshot();
            await page.locator('#qa-ph').evaluate((s,{token})=>s.textContent=`[data-qa-ph="${token}"]::placeholder,[data-qa-ph="${token}"]::-webkit-input-placeholder{font-size:16px!important}`,{token});
            await page.waitForTimeout(70); const ref16=await locator.screenshot();
            const d12=pngDiff(current,ref12),d16=pngDiff(current,ref16),r1216=pngDiff(ref12,ref16);
            fs.writeFileSync(`${out}/form-${name}-current.png`,current); fs.writeFileSync(`${out}/form-${name}-12px-reference.png`,ref12); fs.writeFileSync(`${out}/form-${name}-16px-control.png`,ref16);
            if(d12>4)issues.push(`form ${name}: painted placeholder does not match 12px reference (${d12})`);
            if(d16<=20||r1216<=20)issues.push(`form ${name}: placeholder not visually distinct from 16px control`);
            if(px(metrics.field)<16)issues.push(`form ${name}: entered text is ${metrics.field}, expected >=16px`);
            await page.locator('#qa-ph').evaluate(el=>el.remove()); await locator.evaluate(el=>el.removeAttribute('data-qa-ph'));
            return{metrics,d12,d16,r1216};
          }

          async function reviewForms(browser){
            const context=await browser.newContext({viewport:{width:390,height:844}});
            const page=await context.newPage();
            // Fresh isolated context means popup state from route screenshots cannot hide this form.
            await page.goto(base+'/',{waitUntil:'networkidle',timeout:60000}); await page.waitForTimeout(950);
            let reservation=page.locator('[aria-label="The Sunday Reservation"]');
            if(!await reservation.isVisible().catch(()=>false)){
              await page.evaluate(()=>{localStorage.clear();sessionStorage.clear();});
              await page.reload({waitUntil:'networkidle'}); await page.waitForTimeout(950); reservation=page.locator('[aria-label="The Sunday Reservation"]');
            }
            report.forms.reservationVisible=await reservation.isVisible().catch(()=>false);
            if(report.forms.reservationVisible){
              report.forms.reservationPlaceholder=await placeholderProof(page,reservation.locator('input[placeholder="you@example.com"]'),'reservation-email');
              report.forms.reservationLabel=await reservation.locator('label[for="reservationEmail"]').evaluate(el=>getComputedStyle(el).fontSize);
              if(px(report.forms.reservationLabel)>10)issues.push(`Reservation label remains ${report.forms.reservationLabel}`);
              await page.screenshot({path:`${out}/form-reservation-mobile.png`,fullPage:false});
              await dismissReservation(page);
            }else issues.push('Reservation popup could not be opened in a fresh browser context');

            const start=page.getByText('Start A Project',{exact:true}).first(); await start.evaluate(el=>el.click());
            const inquiry=page.locator('[aria-label="Project inquiry"]'); await inquiry.waitFor({state:'visible'});
            const form=inquiry.locator('form[data-inq]');
            report.forms.projectLabelsStep1=await form.locator('label > span:first-child').evaluateAll(els=>els.filter(el=>getComputedStyle(el).display!=='none').map(el=>({text:el.textContent.trim(),size:getComputedStyle(el).fontSize})));
            for(const x of report.forms.projectLabelsStep1){if(px(x.size)>10)issues.push(`Project Inquiry label ${x.text} remains ${x.size}`);}
            await page.screenshot({path:`${out}/form-project-step1-mobile.png`,fullPage:false});
            await form.locator('input[name="name"]').fill('QA Test'); await form.locator('input[name="email"]').fill('qa@example.com'); await form.locator('input[name="phone"]').fill('2025550123'); await form.locator('input[name="business"]').fill('QA Studio');
            await form.locator('[data-stepbtns] button').first().click(); await page.waitForTimeout(120);
            report.forms.projectWebsite=await placeholderProof(page,form.locator('input[name="website"]'),'project-website');
            report.forms.projectBudget=await placeholderProof(page,form.locator('input[name="budget"]'),'project-budget');
            report.forms.projectDatePrompt=await form.locator('[aria-haspopup="dialog"]').first().evaluate(el=>getComputedStyle(el).fontSize);
            if(px(report.forms.projectDatePrompt)>12.6)issues.push(`Project date prompt remains ${report.forms.projectDatePrompt}`);
            await page.screenshot({path:`${out}/form-project-step2-mobile.png`,fullPage:false});
            await form.locator('[data-stepbtns] button').filter({hasText:'Next'}).click(); await page.waitForTimeout(100); await page.screenshot({path:`${out}/form-project-step3-mobile.png`,fullPage:false});
            const inquiryClose=inquiry.locator('button[aria-label="Close"]'); if(await inquiryClose.count())await inquiryClose.first().click().catch(()=>{});

            await page.goto(base+'/contact/',{waitUntil:'networkidle',timeout:60000}); await page.waitForTimeout(600);
            const contact=page.locator('[data-screen-label="Contact"] form[data-editorial-labels]');
            report.forms.contactLabels=await contact.locator('label > span:first-child').evaluateAll(els=>els.map(el=>({text:el.textContent.trim(),size:getComputedStyle(el).fontSize})));
            for(const x of report.forms.contactLabels){if(px(x.size)>10)issues.push(`Contact label ${x.text} remains ${x.size}`);}
            await contact.scrollIntoViewIfNeeded(); await page.screenshot({path:`${out}/form-contact-mobile.png`,fullPage:false});

            await page.goto(base+'/join-our-team/',{waitUntil:'networkidle',timeout:60000}); await page.waitForTimeout(600);
            const join=page.locator('#program-interest form[data-editorial-labels]');
            report.forms.joinLabels=await join.locator('label > span:first-child').evaluateAll(els=>els.map(el=>({text:el.textContent.trim(),size:getComputedStyle(el).fontSize})));
            for(const x of report.forms.joinLabels){if(px(x.size)>10)issues.push(`Join label ${x.text} remains ${x.size}`);}
            report.forms.joinPrompt=await join.locator('[aria-haspopup="listbox"]').first().evaluate(el=>getComputedStyle(el).fontSize);
            if(px(report.forms.joinPrompt)>12.6)issues.push(`Join program prompt remains ${report.forms.joinPrompt}`);
            await join.scrollIntoViewIfNeeded(); await page.screenshot({path:`${out}/form-join-mobile.png`,fullPage:false});

            await page.goto(base+'/sunday-school/',{waitUntil:'networkidle',timeout:60000}); await page.waitForTimeout(600);
            report.forms.school=await placeholderProof(page,page.locator('#school-notes-email'),'sunday-school-email'); await page.locator('#school-notes-email').scrollIntoViewIfNeeded(); await page.screenshot({path:`${out}/form-sunday-school-mobile.png`,fullPage:false});
            const footerInput=page.locator('footer [aria-label="Newsletter"] input[placeholder="Email Address"]'); report.forms.footer=await placeholderProof(page,footerInput,'footer-email'); await footerInput.scrollIntoViewIfNeeded(); await page.screenshot({path:`${out}/form-footer-mobile.png`,fullPage:false});

            await context.close();
          }

          async function reviewInteractions(browser){
            const context=await browser.newContext({viewport:{width:390,height:844}}); const page=await context.newPage();
            await page.goto(base+'/',{waitUntil:'networkidle',timeout:60000}); await page.waitForTimeout(650); await dismissReservation(page);
            const menu=page.locator('button[aria-label*="menu" i]').first();
            if(await menu.count()){await menu.click().catch(()=>{}); await page.waitForTimeout(100); report.interactions.mobileMenuOpened=true; await page.screenshot({path:`${out}/interaction-mobile-menu.png`,fullPage:false}); await page.keyboard.press('Escape').catch(()=>{});}else report.interactions.mobileMenuOpened='no menu button located';
            const start=page.getByText('Start A Project',{exact:true}).first(); await start.evaluate(el=>el.click()); await page.waitForTimeout(120); const modal=page.locator('[aria-label="Project inquiry"]');
            report.interactions.inquiryOpened=await modal.isVisible().catch(()=>false); if(!report.interactions.inquiryOpened)issues.push('Project Inquiry failed to open');
            report.interactions.focusedAfterOpen=await page.evaluate(()=>({tag:document.activeElement?.tagName,aria:document.activeElement?.getAttribute?.('aria-label'),text:(document.activeElement?.textContent||'').trim().slice(0,80)}));
            await page.keyboard.press('Escape'); await page.waitForTimeout(100); report.interactions.inquiryClosedWithEscape=!await modal.isVisible().catch(()=>false); if(!report.interactions.inquiryClosedWithEscape)issues.push('Project Inquiry failed to close with Escape');
            await context.close();
          }

          (async()=>{
            const browser=await webkit.launch();
            try{
              for(const [mode,viewport] of [['mobile',{width:390,height:844}],['desktop',{width:1440,height:900}]]){
                const context=await browser.newContext({viewport});
                for(const [name,route] of routes)await reviewRoute(context,mode,name,route);
                await context.close();
              }
              await reviewForms(browser);
              await reviewInteractions(browser);
            }catch(err){issues.push(`QA harness/runtime exception: ${err.stack||err}`);}
            finally{
              await browser.close().catch(()=>{});
              fs.writeFileSync(`${out}/review-summary.json`,JSON.stringify(report,null,2));
              console.log('FULL_SITE_REVIEW_V2_SUMMARY'); console.log(JSON.stringify({issueCount:issues.length,issues,forms:report.forms,interactions:report.interactions},null,2));
              if(issues.length)process.exit(1);
            }
          })();
          JS
          node /tmp/full-review-v2.cjs

      - name: Upload all review screenshots and report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: full-site-visual-review-v2
          path: full-site-review-v2
          if-no-files-found: error

      - name: Commit candidate only after complete review passes
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add assets/site.css 'Site Header.dc.html' 'Site Footer.dc.html' 'Inquiry Form.dc.html'
          find . -name '*.html' -not -path './.git/*' -not -path './.github/*' -not -path './node_modules/*' -print0 | xargs -0 git add --
          if git diff --cached --quiet; then
            echo 'No website source changes to commit'
            exit 0
          fi
          git commit -m '[skip netlify] Apply fully reviewed form guidance sizing'
          git push
