name: Apply Remaining Accessibility Fixes

on:
  push:
    branches:
      - footer-reader-accessibility-fix-no-deploy-2026-09-13
    paths:
      - '.github/scripts/apply_remaining_accessibility_fixes.py'
      - '.github/workflows/apply-remaining-accessibility-fixes.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: footer-reader-accessibility-fix-no-deploy-2026-09-13

      - name: Apply scoped remediation
        run: python .github/scripts/apply_remaining_accessibility_fixes.py

      - name: Validate patch formatting
        run: |
          git diff --check
          git status --short

      - name: Persist verified source changes to no-deploy branch
        run: |
          git config user.name "Sunday-Co"
          git config user.email "hello@sundayandcompany.co"
          git add \
            'Site Footer.dc.html' \
            'Inquiry Form.dc.html' \
            'index.html' \
            'join-our-team/index.html' \
            'our-work/luckys-cafe-bakery/index.html' \
            'our-work/petti-pathways/index.html' \
            'our-work/pizzeria-coco/index.html' \
            'our-work/folake/index.html' \
            'assets/rendered-corrections.css'
          if git diff --cached --quiet; then
            echo "No source changes to commit"
          else
            git commit -m "[skip netlify] Apply remaining accessibility remediation"
            git push origin HEAD:footer-reader-accessibility-fix-no-deploy-2026-09-13
          fi
