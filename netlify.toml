# Sunday & Company - Netlify configuration
# The repository root is the production site. Visual styling and behavior live
# in the source files under /assets and the shared DC components.

[build]
publish = "."

[[headers]]
for = "/*"

[headers.values]
X-Frame-Options = "DENY"
X-Content-Type-Options = "nosniff"
Referrer-Policy = "strict-origin-when-cross-origin"
Permissions-Policy = "camera=(), microphone=(), geolocation=(), payment=(), usb=(), magnetometer=(), accelerometer=()"
Strict-Transport-Security = "max-age=63072000; includeSubDomains; preload"
X-XSS-Protection = "1; mode=block"

# Do not mark unhashed production assets immutable. The site uses stable file
# names such as /assets/site.css and /assets/site.js, so a one-year immutable
# cache can leave returning browsers on an old visual/interaction build.
[[headers]]
for = "/assets/*"

[headers.values]
Cache-Control = "public, max-age=3600, must-revalidate"

[[headers]]
for = "/*.html"

[headers.values]
Cache-Control = "public, max-age=0, must-revalidate"

[[redirects]]
from = "http://sundayandcompany.co/*"
to = "https://sundayandcompany.co/:splat"
status = 301
force = true

[[redirects]]
from = "http://www.sundayandcompany.co/*"
to = "https://sundayandcompany.co/:splat"
status = 301
force = true

[[redirects]]
from = "https://www.sundayandcompany.co/*"
to = "https://sundayandcompany.co/:splat"
status = 301
force = true
